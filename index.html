<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR Experience</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  overflow:hidden;
  font-family:Arial, sans-serif;
  color:#fff;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

video, canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#webcam{
  transform:scaleX(-1);
  filter:brightness(.72) contrast(1.15) saturate(.9);
}

#handCanvas{
  z-index:5;
  transform:scaleX(-1);
  pointer-events:none;
  transition:opacity .4s;
}

#atmosphere{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  opacity:0;
  transition:opacity .8s ease;
}

#atmosphere.red{
  opacity:1;
  background:
    radial-gradient(circle at 50% 45%,
      rgba(255,30,40,.28),
      rgba(130,0,20,.45) 45%,
      rgba(0,0,0,.72) 100%);
  animation:redPulse 1.5s infinite alternate;
}

#atmosphere.void{
  opacity:1;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(125,40,255,.35),
      rgba(35,0,80,.65) 45%,
      rgba(0,0,0,.92) 100%);
}

@keyframes redPulse{
  from{
    filter:brightness(.8);
  }
  to{
    filter:brightness(1.35);
  }
}

#fxCanvas{
  z-index:10;
  pointer-events:none;
}

#ui{
  position:absolute;
  z-index:30;
  top:22px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

h1{
  font-size:26px;
  letter-spacing:6px;
  text-shadow:0 0 20px #a855f7;
}

#status{
  margin-top:10px;
  font-size:12px;
  letter-spacing:2px;
  color:#ddd;
}

#startBtn{
  position:absolute;
  z-index:100;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:18px 28px;
  border:1px solid #a855f7;
  border-radius:8px;
  background:rgba(10,0,25,.95);
  color:#fff;
  cursor:pointer;
  font-size:14px;
  letter-spacing:2px;
  box-shadow:0 0 35px rgba(168,85,247,.8);
}

#techniqueText{
  position:absolute;
  z-index:40;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  text-align:center;
  pointer-events:none;
}

#techniqueText.active{
  animation:textReveal 1.5s forwards;
}

#techniqueJapanese{
  font-size:clamp(50px,10vw,120px);
  font-weight:bold;
  text-shadow:0 0 25px #a855f7;
}

#techniqueName{
  margin-top:12px;
  letter-spacing:9px;
  font-size:18px;
}

@keyframes textReveal{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.4);
    filter:blur(20px);
  }
  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.12);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#flash{
  position:absolute;
  inset:0;
  z-index:50;
  opacity:0;
  pointer-events:none;
}

#flash.active{
  animation:flashAnim .65s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  15%{opacity:.85}
  100%{opacity:0}
}

</style>
</head>

<body>

<div id="app">

  <video id="webcam" autoplay playsinline></video>

  <canvas id="handCanvas"></canvas>

  <div id="atmosphere"></div>

  <canvas id="fxCanvas"></canvas>

  <div id="techniqueText">
    <div id="techniqueJapanese"></div>
    <div id="techniqueName"></div>
  </div>

  <div id="flash"></div>

  <div id="ui">
    <h1>JJK AR EXPERIENCE</h1>
    <div id="status">SYSTEM READY</div>
  </div>

  <button id="startBtn">
    ACTIVATE CAMERA
  </button>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const video = document.getElementById("webcam");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const fxCanvas =
  document.getElementById("fxCanvas");

const fx =
  fxCanvas.getContext("2d");

const status =
  document.getElementById("status");

const startBtn =
  document.getElementById("startBtn");

const atmosphere =
  document.getElementById("atmosphere");

const flash =
  document.getElementById("flash");

const techniqueText =
  document.getElementById("techniqueText");

const techniqueJapanese =
  document.getElementById("techniqueJapanese");

const techniqueName =
  document.getElementById("techniqueName");


/* =========================================
   STATE
========================================= */

let active = false;
let currentEffect = null;
let animationId = null;

let lastHandPosition = {
  x:window.innerWidth / 2,
  y:window.innerHeight / 2
};


/* =========================================
   RESIZE
========================================= */

function resize(){

  handCanvas.width = window.innerWidth;
  handCanvas.height = window.innerHeight;

  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;

}

window.addEventListener("resize",resize);

resize();


/* =========================================
   GESTURE DETECTION
========================================= */


/* RED = ONE INDEX FINGER */

function isRedPose(hand){

  const indexUp =
    hand[8].y < hand[6].y &&
    hand[6].y < hand[5].y;

  const middleDown =
    hand[12].y > hand[10].y;

  const ringDown =
    hand[16].y > hand[14].y;

  const pinkyDown =
    hand[20].y > hand[18].y;

  return (
    indexUp &&
    middleDown &&
    ringDown &&
    pinkyDown
  );

}


/* INFINITY = TWO FINGERS */

function isInfinityPose(hand){

  const indexUp =
    hand[8].y < hand[6].y;

  const middleUp =
    hand[12].y < hand[10].y;

  const ringDown =
    hand[16].y > hand[14].y;

  const pinkyDown =
    hand[20].y > hand[18].y;


  const distance =
    Math.hypot(
      hand[8].x - hand[12].x,
      hand[8].y - hand[12].y
    );


  return (
    indexUp &&
    middleUp &&
    ringDown &&
    pinkyDown &&
    distance < 0.18
  );

}


/* =========================================
   RED PARTICLES
========================================= */

class RedParticle{

  constructor(cx,cy){

    this.cx = cx;
    this.cy = cy;

    this.angle =
      Math.random() * Math.PI * 2;

    this.radius =
      20 + Math.random() * 180;

    this.speed =
      (Math.random() * .035 + .01) *
      (Math.random() > .5 ? 1 : -1);

    this.size =
      Math.random() * 3 + 1;

    this.history = [];

    this.type =
      Math.random() > .4 ? "white" : "red";

  }


  update(){

    this.angle += this.speed;

    this.radius +=
      Math.sin(this.angle * 2) * .8;

    this.x =
      this.cx +
      Math.cos(this.angle) *
      this.radius;

    this.y =
      this.cy +
      Math.sin(this.angle) *
      this.radius * .6;


    this.history.push({
      x:this.x,
      y:this.y
    });

    if(this.history.length > 8){

      this.history.shift();

    }

  }


  draw(){

    /* TRAIL */

    if(this.history.length > 2){

      fx.beginPath();

      fx.moveTo(
        this.history[0].x,
        this.history[0].y
      );

      for(let i=1;
          i<this.history.length;
          i++){

        fx.lineTo(
          this.history[i].x,
          this.history[i].y
        );

      }

      fx.strokeStyle =
        this.type === "white"
        ? "rgba(255,255,255,.35)"
        : "rgba(255,20,40,.4)";

      fx.lineWidth = 1;

      fx.stroke();

    }


    /* PARTICLE */

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2
    );


    const color =
      this.type === "white"
      ? "#ffffff"
      : "#ff1735";


    fx.fillStyle = color;

    fx.shadowBlur = 20;

    fx.shadowColor = color;

    fx.fill();

  }

}


/* =========================================
   AMBIENT PARTICLES
========================================= */

class AmbientParticle{

  constructor(){

    this.x =
      Math.random() * fxCanvas.width;

    this.y =
      Math.random() * fxCanvas.height;

    this.vx =
      (Math.random()-.5) * .8;

    this.vy =
      (Math.random()-.5) * .8;

    this.size =
      Math.random()*2+.5;

    this.alpha =
      Math.random()*.5+.15;

  }


  update(){

    this.x += this.vx;
    this.y += this.vy;

    if(
      this.x < 0 ||
      this.x > fxCanvas.width ||
      this.y < 0 ||
      this.y > fxCanvas.height
    ){

      this.x =
        Math.random()*fxCanvas.width;

      this.y =
        Math.random()*fxCanvas.height;

    }

  }


  draw(){

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    fx.fillStyle =
      `rgba(255,${Math.random()>0.5?255:40},${Math.random()>0.5?255:60},${this.alpha})`;

    fx.fill();

  }

}


let redParticles = [];
let ambientParticles = [];


/* =========================================
   CREATE RED ENERGY
========================================= */

function createRedEnergy(cx,cy){

  redParticles = [];
  ambientParticles = [];


  for(let i=0;i<170;i++){

    redParticles.push(
      new RedParticle(cx,cy)
    );

  }


  for(let i=0;i<180;i++){

    ambientParticles.push(
      new AmbientParticle()
    );

  }

}


/* =========================================
   DRAW RED CORE
========================================= */

function drawRedCore(cx,cy,time){

  const pulse =
    32 + Math.sin(time*.01)*8;


  const gradient =
    fx.createRadialGradient(
      cx,cy,0,
      cx,cy,pulse*4
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    .15,
    "rgba(255,40,50,1)"
  );

  gradient.addColorStop(
    .5,
    "rgba(255,0,30,.45)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,0,0,0)"
  );


  fx.fillStyle = gradient;

  fx.beginPath();

  fx.arc(
    cx,
    cy,
    pulse*4,
    0,
    Math.PI*2
  );

  fx.fill();


  /* CORE */

  fx.beginPath();

  fx.arc(
    cx,
    cy,
    pulse,
    0,
    Math.PI*2
  );

  fx.fillStyle = "#ff1635";

  fx.shadowBlur = 50;

  fx.shadowColor = "#ff002b";

  fx.fill();


  /* RINGS */

  for(let i=0;i<3;i++){

    fx.beginPath();

    fx.ellipse(
      cx,
      cy,
      pulse*(2+i*.5),
      pulse*(.6+i*.15),
      time*.002*(i%2?1:-1),
      0,
      Math.PI*2
    );

    fx.strokeStyle =
      "rgba(255,100,120,.55)";

    fx.lineWidth = 1.5;

    fx.stroke();

  }

}


/* =========================================
   RED LIGHTNING
========================================= */

function drawRedLightning(cx,cy){

  for(let b=0;b<7;b++){

    let angle =
      Math.random()*Math.PI*2;

    let x = cx;
    let y = cy;

    fx.beginPath();

    fx.moveTo(x,y);

    for(let i=0;i<7;i++){

      x +=
        Math.cos(
          angle +
          (Math.random()-.5)*.8
        ) *
        (20+i*14);

      y +=
        Math.sin(
          angle +
          (Math.random()-.5)*.8
        ) *
        (20+i*14);

      fx.lineTo(x,y);

    }

    fx.strokeStyle =
      "rgba(255,220,220,.55)";

    fx.lineWidth = 1.5;

    fx.shadowBlur = 15;

    fx.shadowColor = "#ff002b";

    fx.stroke();

  }

}


/* =========================================
   RED ANIMATION
========================================= */

function animateRed(time){

  if(currentEffect !== "RED") return;


  fx.fillStyle =
    "rgba(0,0,0,.10)";

  fx.fillRect(
    0,
    0,
    fxCanvas.width,
    fxCanvas.height
  );


  const cx =
    lastHandPosition.x;

  const cy =
    lastHandPosition.y;


  /* AMBIENT */

  ambientParticles.forEach(p=>{

    p.update();
    p.draw();

  });


  /* ORBIT */

  redParticles.forEach(p=>{

    p.cx = cx;
    p.cy = cy;

    p.update();
    p.draw();

  });


  drawRedCore(
    cx,
    cy,
    time
  );


  if(Math.random() > .5){

    drawRedLightning(
      cx,
      cy
    );

  }


  animationId =
    requestAnimationFrame(
      animateRed
    );

}


/* =========================================
   INFINITY VOID
========================================= */

let stars = [];


function createVoid(){

  stars = [];

  for(let i=0;i<700;i++){

    stars.push({

      x:
        Math.random()*fxCanvas.width,

      y:
        Math.random()*fxCanvas.height,

      z:
        Math.random()*3+.5,

      size:
        Math.random()*2+.3,

      speed:
        Math.random()*2+1

    });

  }

}


function animateVoid(time){

  if(currentEffect !== "INFINITY")
    return;


  fx.fillStyle =
    "rgba(0,0,10,.22)";

  fx.fillRect(
    0,
    0,
    fxCanvas.width,
    fxCanvas.height
  );


  const cx =
    fxCanvas.width/2;

  const cy =
    fxCanvas.height/2;


  /* STARS MOVING INTO VOID */

  stars.forEach(s=>{

    const dx = s.x-cx;
    const dy = s.y-cy;

    s.x += dx*.003*s.speed;
    s.y += dy*.003*s.speed;


    if(
      s.x < 0 ||
      s.x > fxCanvas.width ||
      s.y < 0 ||
      s.y > fxCanvas.height
    ){

      s.x = cx+(Math.random()-.5)*30;
      s.y = cy+(Math.random()-.5)*30;

    }


    fx.beginPath();

    fx.arc(
      s.x,
      s.y,
      s.size*s.z,
      0,
      Math.PI*2
    );

    fx.fillStyle =
      Math.random()>.6
      ? "rgba(255,255,255,.8)"
      : "rgba(170,80,255,.8)";

    fx.shadowBlur = 12;

    fx.shadowColor =
      "#8b5cf6";

    fx.fill();

  });


  /* INFINITE RINGS */

  for(let i=0;i<7;i++){

    fx.beginPath();

    fx.ellipse(
      cx,
      cy,
      100+i*100,
      50+i*45,
      time*.0005+i,
      0,
      Math.PI*2
    );

    fx.strokeStyle =
      "rgba(170,80,255,.25)";

    fx.lineWidth = 2;

    fx.stroke();

  }


  animationId =
    requestAnimationFrame(
      animateVoid
    );

}


/* =========================================
   ACTIVATE RED
========================================= */

function activateRed(){

  if(active) return;

  active = true;

  currentEffect = "RED";

  handCanvas.style.opacity = "0";

  status.innerText =
    "🔴 CURSED TECHNIQUE: RED";


  atmosphere.className =
    "red";

  flash.style.background =
    "#ff1735";

  flash.classList.add("active");


  createRedEnergy(
    lastHandPosition.x,
    lastHandPosition.y
  );


  animationId =
    requestAnimationFrame(
      animateRed
    );


  setTimeout(()=>{

    stopEffect();

  },9000);

}


/* =========================================
   ACTIVATE INFINITY
========================================= */

function activateInfinity(){

  if(active) return;

  active = true;

  currentEffect = "INFINITY";

  handCanvas.style.opacity = "0";

  status.innerText =
    "∞ INFINITY ACTIVATED";


  atmosphere.className =
    "void";


  flash.style.background =
    "#a855f7";

  flash.classList.add("active");


  setTimeout(()=>{

    status.innerText =
      "DOMAIN EXPANSION";

    createVoid();

    animationId =
      requestAnimationFrame(
        animateVoid
      );

  },700);


  setTimeout(()=>{

    techniqueJapanese.innerText =
      "無量空処";

    techniqueName.innerText =
      "UNLIMITED VOID";

    techniqueText.classList.add("active");

  },2000);


  setTimeout(()=>{

    stopEffect();

  },11000);

}


/* =========================================
   STOP EFFECT
========================================= */

function stopEffect(){

  cancelAnimationFrame(
    animationId
  );

  currentEffect = null;

  fx.clearRect(
    0,
    0,
    fxCanvas.width,
    fxCanvas.height
  );

  atmosphere.className = "";

  techniqueText.classList.remove(
    "active"
  );

  handCanvas.style.opacity = "1";

  status.innerText =
    "☝️ RED | 🤞 INFINITY";

  active = false;

}


/* =========================================
   MEDIAPIPE HAND TRACKING
========================================= */

const hands = new Hands({

  locateFile:(file)=>{

    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

  }

});


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.7,

  minTrackingConfidence:.7

});


hands.onResults(results=>{

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );


  if(
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ){

    return;

  }


  const hand =
    results.multiHandLandmarks[0];


  /* SAVE INDEX FINGER POSITION */

  lastHandPosition = {

    x:
      (1-hand[8].x) *
      window.innerWidth,

    y:
      hand[8].y *
      window.innerHeight

  };


  /* DRAW HAND */

  if(!active){

    drawConnectors(
      handCtx,
      hand,
      HAND_CONNECTIONS,
      {
        color:"#ff3050",
        lineWidth:3
      }
    );


    drawLandmarks(
      handCtx,
      hand,
      {
        color:"#ffffff",
        radius:4
      }
    );

  }


  /* PRIORITY:
     INFINITY FIRST
  */

  if(
    !active &&
    isInfinityPose(hand)
  ){

    activateInfinity();

  }


  else if(
    !active &&
    isRedPose(hand)
  ){

    activateRed();

  }


  else if(!active){

    status.innerText =
      "☝️ RED | 🤞 INFINITY";

  }

});


/* =========================================
   CAMERA
========================================= */

startBtn.addEventListener(
  "click",
  async()=>{

    try{

      status.innerText =
        "ACTIVATING CAMERA...";


      const stream =
        await navigator.mediaDevices.getUserMedia({

          video:true,
          audio:false

        });


      video.srcObject =
        stream;

      await video.play();


      startBtn.style.display =
        "none";


      const camera =
        new Camera(video,{

          onFrame:async()=>{

            await hands.send({

              image:video

            });

          },

          width:1280,
          height:720

        });


      camera.start();


      status.innerText =
        "☝️ RED | 🤞 INFINITY";


    }

    catch(error){

      console.error(error);

      status.innerText =
        "CAMERA ACCESS DENIED";

    }

  }
);

</script>

</body>
</html>
