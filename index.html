<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR Experience</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#webcam{
  transform:scaleX(-1);
  filter:brightness(.65) contrast(1.15) saturate(.85);
}

#handCanvas{
  z-index:5;
  transform:scaleX(-1);
  pointer-events:none;
  transition:.4s;
}

#fxCanvas{
  z-index:10;
  pointer-events:none;
}

#atmosphere{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  opacity:0;
  transition:opacity .7s;
}

#atmosphere.red{
  opacity:1;
  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(255,0,30,.20) 0%,
      rgba(180,0,20,.16) 30%,
      rgba(70,0,10,.20) 60%,
      rgba(0,0,0,.45) 100%
    );
  animation:cursePulse 1.2s infinite alternate;
}

#atmosphere.void{
  opacity:1;
  background:
    radial-gradient(
      circle at center,
      rgba(100,20,255,.35),
      rgba(20,0,60,.7) 50%,
      rgba(0,0,0,.9)
    );
}

@keyframes cursePulse{
  from{filter:brightness(.8)}
  to{filter:brightness(1.5)}
}

#ui{
  position:absolute;
  z-index:30;
  top:22px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

h1{
  letter-spacing:7px;
  font-size:25px;
  text-shadow:0 0 20px #9b5cff;
}

#status{
  margin-top:10px;
  font-size:12px;
  letter-spacing:2px;
}

#startBtn{
  position:absolute;
  z-index:100;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:18px 28px;
  border:1px solid #ff3050;
  border-radius:8px;
  background:#080008;
  color:white;
  cursor:pointer;
  letter-spacing:2px;
  box-shadow:0 0 30px rgba(255,0,50,.5);
}

#techniqueText{
  position:absolute;
  z-index:40;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  pointer-events:none;
  text-align:center;
}

#techniqueText.active{
  animation:reveal 1.5s forwards;
}

@keyframes reveal{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
    filter:blur(20px);
  }
  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#techniqueJapanese{
  font-size:clamp(55px,10vw,120px);
  font-weight:bold;
  text-shadow:0 0 30px #a855f7;
}

#techniqueName{
  letter-spacing:8px;
  margin-top:12px;
}

#flash{
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:0;
}

#flash.active{
  animation:flashAnim .7s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  15%{opacity:.8}
  100%{opacity:0}
}
</style>
</head>

<body>

<div id="app">

  <video id="webcam" autoplay playsinline></video>

  <canvas id="handCanvas"></canvas>

  <div id="atmosphere"></div>

  <canvas id="fxCanvas"></canvas>

  <div id="techniqueText">
    <div id="techniqueJapanese"></div>
    <div id="techniqueName"></div>
  </div>

  <div id="flash"></div>

  <div id="ui">
    <h1>JJK AR EXPERIENCE</h1>
    <div id="status">SYSTEM READY</div>
  </div>

  <button id="startBtn">ACTIVATE CAMERA</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const video = document.getElementById("webcam");
const handCanvas = document.getElementById("handCanvas");
const handCtx = handCanvas.getContext("2d");

const fxCanvas = document.getElementById("fxCanvas");
const fx = fxCanvas.getContext("2d");

const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const atmosphere = document.getElementById("atmosphere");
const flash = document.getElementById("flash");

const techniqueText = document.getElementById("techniqueText");
const techniqueJapanese = document.getElementById("techniqueJapanese");
const techniqueName = document.getElementById("techniqueName");


let active = false;
let currentEffect = null;
let animationId;

let handPos = {
  x: innerWidth / 2,
  y: innerHeight / 2
};


/* =========================================
   RESIZE
========================================= */

function resize(){
  handCanvas.width = innerWidth;
  handCanvas.height = innerHeight;

  fxCanvas.width = innerWidth;
  fxCanvas.height = innerHeight;
}

addEventListener("resize",resize);
resize();


/* =========================================
   GESTURES
========================================= */

function isRedPose(h){

  return (
    h[8].y < h[6].y &&
    h[12].y > h[10].y &&
    h[16].y > h[14].y &&
    h[20].y > h[18].y
  );

}

function isInfinityPose(h){

  const indexUp = h[8].y < h[6].y;
  const middleUp = h[12].y < h[10].y;

  const ringDown = h[16].y > h[14].y;
  const pinkyDown = h[20].y > h[18].y;

  const d = Math.hypot(
    h[8].x-h[12].x,
    h[8].y-h[12].y
  );

  return indexUp && middleUp &&
         ringDown && pinkyDown &&
         d < .18;
}


/* =========================================
   CURSED ENERGY PARTICLE
========================================= */

class CursedParticle{

  constructor(x,y){

    this.x = x;
    this.y = y;

    const angle =
      Math.random()*Math.PI*2;

    const power =
      Math.random()*12+3;

    this.vx =
      Math.cos(angle)*power;

    this.vy =
      Math.sin(angle)*power;

    this.gravity =
      (Math.random()-.5)*.05;

    this.drag =
      .965 + Math.random()*.02;

    this.size =
      Math.random()*4+1;

    this.life =
      Math.random()*80+60;

    this.maxLife =
      this.life;

    this.history=[];

    this.color =
      Math.random()>.22
      ? "red"
      : "white";

    this.wave =
      Math.random()*Math.PI*2;

  }


  update(){

    this.history.push({
      x:this.x,
      y:this.y
    });

    if(this.history.length>18){
      this.history.shift();
    }


    /* CHAOTIC MOVEMENT */

    this.wave += .15;

    this.vx +=
      Math.sin(this.wave)*.12;

    this.vy +=
      Math.cos(this.wave*1.4)*.12;

    this.vy += this.gravity;

    this.vx *= this.drag;
    this.vy *= this.drag;

    this.x += this.vx;
    this.y += this.vy;

    this.life--;

  }


  draw(){

    const alpha =
      Math.max(
        this.life/this.maxLife,
        0
      );


    /* LONG ENERGY TRAIL */

    if(this.history.length>2){

      for(let i=1;
          i<this.history.length;
          i++){

        const p1 =
          this.history[i-1];

        const p2 =
          this.history[i];

        const a =
          (i/this.history.length)*
          alpha*.6;

        fx.beginPath();

        fx.moveTo(p1.x,p1.y);
        fx.lineTo(p2.x,p2.y);

        fx.strokeStyle =
          this.color==="white"
          ? `rgba(255,255,255,${a})`
          : `rgba(255,15,40,${a})`;

        fx.lineWidth =
          this.size*(i/this.history.length);

        fx.shadowBlur = 12;

        fx.shadowColor =
          this.color==="white"
          ? "#fff"
          : "#ff0022";

        fx.stroke();

      }

    }


    /* ENERGY SPARK */

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size*alpha,
      0,
      Math.PI*2
    );

    const color =
      this.color==="white"
      ? "#fff"
      : "#ff1735";

    fx.fillStyle = color;

    fx.shadowBlur = 20;

    fx.shadowColor = color;

    fx.fill();

  }

}


/* =========================================
   ENERGY CLOUD PARTICLES
========================================= */

class EnergySmoke{

  constructor(x,y){

    this.x =
      x+(Math.random()-.5)*100;

    this.y =
      y+(Math.random()-.5)*100;

    this.size =
      Math.random()*120+40;

    this.alpha =
      Math.random()*.12+.03;

    this.vx =
      (Math.random()-.5)*1.5;

    this.vy =
      (Math.random()-.5)*1.5;

    this.life =
      Math.random()*100+80;

  }

  update(){

    this.x += this.vx;
    this.y += this.vy;

    this.size += .8;

    this.life--;

  }

  draw(){

    const gradient =
      fx.createRadialGradient(
        this.x,this.y,0,
        this.x,this.y,this.size
      );

    gradient.addColorStop(
      0,
      `rgba(255,0,30,${this.alpha})`
    );

    gradient.addColorStop(
      1,
      "rgba(255,0,30,0)"
    );

    fx.fillStyle = gradient;

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    fx.fill();

  }

}


/* =========================================
   PARTICLE ARRAYS
========================================= */

let cursedParticles = [];
let smokeParticles = [];


/* =========================================
   CREATE ENERGY BURST
========================================= */

function createCursedEnergy(x,y){

  cursedParticles = [];
  smokeParticles = [];


  /* DENSE EXPLOSION */

  for(let i=0;i<240;i++){

    cursedParticles.push(
      new CursedParticle(x,y)
    );

  }


  /* RED ENERGY CLOUD */

  for(let i=0;i<25;i++){

    smokeParticles.push(
      new EnergySmoke(x,y)
    );

  }

}


/* =========================================
   RED ENERGY CORE
========================================= */

function drawEnergyCore(x,y,time){

  const pulse =
    20+
    Math.sin(time*.012)*7;


  /* HUGE GLOW */

  const glow =
    fx.createRadialGradient(
      x,y,0,
      x,y,pulse*7
    );

  glow.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  glow.addColorStop(
    .08,
    "rgba(255,80,80,.95)"
  );

  glow.addColorStop(
    .25,
    "rgba(255,0,30,.65)"
  );

  glow.addColorStop(
    .6,
    "rgba(255,0,20,.18)"
  );

  glow.addColorStop(
    1,
    "rgba(255,0,0,0)"
  );


  fx.fillStyle = glow;

  fx.beginPath();

  fx.arc(
    x,y,
    pulse*7,
    0,
    Math.PI*2
  );

  fx.fill();


  /* INNER CORE */

  fx.beginPath();

  fx.arc(
    x,y,
    pulse,
    0,
    Math.PI*2
  );

  fx.fillStyle="#ff1430";

  fx.shadowBlur=60;

  fx.shadowColor="#ff0022";

  fx.fill();


  /* WHITE HOT CENTER */

  fx.beginPath();

  fx.arc(
    x,y,
    pulse*.38,
    0,
    Math.PI*2
  );

  fx.fillStyle="#fff";

  fx.fill();

}


/* =========================================
   CHAOTIC CURSED LIGHTNING
========================================= */

function lightning(x,y){

  for(let b=0;b<4;b++){

    const angle =
      Math.random()*Math.PI*2;

    const length =
      Math.random()*250+100;

    let px=x;
    let py=y;

    fx.beginPath();

    fx.moveTo(px,py);

    for(let i=0;i<10;i++){

      const step =
        length/10;

      px +=
        Math.cos(angle)*
        step+
        (Math.random()-.5)*35;

      py +=
        Math.sin(angle)*
        step+
        (Math.random()-.5)*35;

      fx.lineTo(px,py);

    }

    fx.strokeStyle =
      Math.random()>.5
      ? "rgba(255,30,50,.55)"
      : "rgba(255,255,255,.35)";

    fx.lineWidth =
      Math.random()*2+1;

    fx.shadowBlur=18;

    fx.shadowColor="#ff0022";

    fx.stroke();

  }

}


/* =========================================
   RED ANIMATION
========================================= */

function animateRed(time){

  if(currentEffect!=="RED") return;


  /* TRAIL FADE */

  fx.fillStyle =
    "rgba(0,0,0,.12)";

  fx.fillRect(
    0,0,
    fxCanvas.width,
    fxCanvas.height
  );


  const x = handPos.x;
  const y = handPos.y;


  /* SMOKE */

  smokeParticles.forEach((p,i)=>{

    p.update();
    p.draw();

    if(p.life<=0){

      smokeParticles[i] =
        new EnergySmoke(x,y);

    }

  });


  /* CHAOTIC PARTICLES */

  cursedParticles.forEach((p,i)=>{

    p.update();
    p.draw();


    if(p.life<=0){

      /* NEW PARTICLES KEEP
         EXPLODING FROM CORE */

      cursedParticles[i] =
        new CursedParticle(x,y);

    }

  });


  drawEnergyCore(x,y,time);


  /* RANDOM LIGHTNING */

  if(Math.random()>.65){

    lightning(x,y);

  }


  animationId =
    requestAnimationFrame(
      animateRed
    );

}


/* =========================================
   INFINITY VOID
========================================= */

let stars=[];

function createVoid(){

  stars=[];

  for(let i=0;i<500;i++){

    stars.push({

      x:Math.random()*fxCanvas.width,
      y:Math.random()*fxCanvas.height,

      vx:(Math.random()-.5)*2,
      vy:(Math.random()-.5)*2,

      size:Math.random()*2+.4

    });

  }

}


function animateVoid(time){

  if(currentEffect!=="INFINITY")
    return;


  fx.fillStyle=
    "rgba(0,0,15,.18)";

  fx.fillRect(
    0,0,
    fxCanvas.width,
    fxCanvas.height
  );


  stars.forEach(s=>{

    s.x+=s.vx;
    s.y+=s.vy;

    if(
      s.x<0||
      s.x>fxCanvas.width||
      s.y<0||
      s.y>fxCanvas.height
    ){

      s.x=Math.random()*fxCanvas.width;
      s.y=Math.random()*fxCanvas.height;

    }

    fx.beginPath();

    fx.arc(
      s.x,s.y,s.size,
      0,Math.PI*2
    );

    fx.fillStyle =
      "rgba(180,100,255,.8)";

    fx.shadowBlur=12;
    fx.shadowColor="#8b5cf6";

    fx.fill();

  });


  animationId=
    requestAnimationFrame(
      animateVoid
    );

}


/* =========================================
   ACTIVATE RED
========================================= */

function activateRed(){

  if(active)return;

  active=true;
  currentEffect="RED";

  handCanvas.style.opacity="0";

  status.innerText=
    "🔴 CURSED TECHNIQUE: RED";

  atmosphere.className="red";

  flash.style.background="#ff0022";

  flash.classList.add("active");

  createCursedEnergy(
    handPos.x,
    handPos.y
  );

  animateRed(performance.now());


  setTimeout(stopEffect,9000);

}


/* =========================================
   ACTIVATE INFINITY
========================================= */

function activateInfinity(){

  if(active)return;

  active=true;
  currentEffect="INFINITY";

  handCanvas.style.opacity="0";

  atmosphere.className="void";

  flash.style.background="#a855f7";

  flash.classList.add("active");

  status.innerText=
    "∞ INFINITY ACTIVATED";


  setTimeout(()=>{

    createVoid();

    animateVoid(
      performance.now()
    );

    status.innerText=
      "DOMAIN EXPANSION";

  },600);


  setTimeout(()=>{

    techniqueJapanese.innerText=
      "無量空処";

    techniqueName.innerText=
      "UNLIMITED VOID";

    techniqueText.classList.add(
      "active"
    );

  },1800);


  setTimeout(stopEffect,11000);

}


/* =========================================
   STOP
========================================= */

function stopEffect(){

  cancelAnimationFrame(animationId);

  currentEffect=null;

  fx.clearRect(
    0,0,
    fxCanvas.width,
    fxCanvas.height
  );

  atmosphere.className="";

  techniqueText.classList.remove(
    "active"
  );

  handCanvas.style.opacity="1";

  status.innerText=
    "☝️ RED | 🤞 INFINITY";

  active=false;

}


/* =========================================
   MEDIAPIPE
========================================= */

const hands = new Hands({

  locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:1,
  modelComplexity:1,

  minDetectionConfidence:.7,
  minTrackingConfidence:.7

});


hands.onResults(results=>{

  handCtx.clearRect(
    0,0,
    handCanvas.width,
    handCanvas.height
  );


  if(
    !results.multiHandLandmarks ||
    !results.multiHandLandmarks.length
  ) return;


  const hand =
    results.multiHandLandmarks[0];


  /* FINGER POSITION */

  handPos.x =
    (1-hand[8].x)*innerWidth;

  handPos.y =
    hand[8].y*innerHeight;


  if(!active){

    drawConnectors(
      handCtx,
      hand,
      HAND_CONNECTIONS,
      {
        color:"#ff3050",
        lineWidth:3
      }
    );

    drawLandmarks(
      handCtx,
      hand,
      {
        color:"#fff",
        radius:4
      }
    );

  }


  /* GESTURES */

  if(
    !active &&
    isInfinityPose(hand)
  ){

    activateInfinity();

  }

  else if(
    !active &&
    isRedPose(hand)
  ){

    activateRed();

  }

});


/* =========================================
   CAMERA
========================================= */

startBtn.onclick=async()=>{

  try{

    const stream =
      await navigator.mediaDevices
      .getUserMedia({
        video:true,
        audio:false
      });

    video.srcObject=stream;

    await video.play();

    startBtn.style.display="none";


    const camera =
      new Camera(video,{

        onFrame:async()=>{

          await hands.send({
            image:video
          });

        },

        width:1280,
        height:720

      });

    camera.start();


    status.innerText=
      "☝️ RED | 🤞 INFINITY";

  }

  catch(err){

    status.innerText=
      "CAMERA ACCESS DENIED";

    console.error(err);

  }

};

</script>

</body>
</html>
