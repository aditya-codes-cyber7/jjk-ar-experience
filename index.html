<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR Experience</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#020205;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

#canvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:
        radial-gradient(circle at center, #08080d 0%, #020205 60%, #000 100%);
}

#cameraBox{
    position:fixed;
    left:25px;
    bottom:25px;
    width:220px;
    height:165px;

    border:1px solid rgba(120,220,255,.45);
    border-radius:14px;

    overflow:hidden;
    background:#000;

    box-shadow:
        0 0 20px rgba(0,200,255,.2),
        inset 0 0 20px rgba(0,0,0,.8);

    z-index:10;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    opacity:.85;
}

#cameraLabel{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;

    padding:7px;

    font-size:10px;
    letter-spacing:2px;
    text-align:center;

    background:rgba(0,0,0,.7);
    color:#9cecff;
}

#title{
    position:fixed;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:20;
    pointer-events:none;
}

#title h1{
    font-size:24px;
    letter-spacing:9px;
    font-weight:600;
    text-shadow:0 0 20px rgba(150,220,255,.5);
}

#title p{
    margin-top:8px;
    font-size:8px;
    letter-spacing:4px;
    color:#76dfff;
}

#status{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    font-size:11px;
    letter-spacing:3px;

    color:#a7eaff;
    opacity:.7;

    z-index:20;
}

#controls{
    position:fixed;
    right:25px;
    bottom:25px;

    display:flex;
    gap:8px;
    z-index:30;
}

button{
    background:rgba(10,10,20,.75);
    border:1px solid rgba(255,255,255,.2);
    color:white;

    padding:10px 14px;
    border-radius:8px;

    cursor:pointer;
    font-size:11px;
    letter-spacing:1px;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    border-color:#fff;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="title">
    <h1>呪術廻戦</h1>
    <p>CURSED TECHNIQUE EXPERIENCE</p>
</div>

<div id="cameraBox">
    <video id="video" autoplay playsinline></video>
    <div id="cameraLabel">AR POSE DETECTION</div>
</div>

<div id="status">
    SYSTEM READY
</div>

<div id="controls">
    <button onclick="infinityVoid()">INFINITY</button>
    <button onclick="redTechnique()">RED</button>
    <button onclick="resetScene()">RESET</button>
</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize(){

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W = window.innerWidth;
    H = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =====================================================
   WEBCAM
===================================================== */

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({
    video:{
        width:{ideal:1280},
        height:{ideal:720},
        facingMode:"user"
    },
    audio:false
})
.then(stream=>{
    video.srcObject = stream;
})
.catch(err=>{
    document.getElementById("status").innerText =
    "CAMERA ACCESS REQUIRED";
});


/* =====================================================
   PARTICLE SYSTEM
===================================================== */

let particles = [];
let stars = [];

let mode = "idle";
let animationStart = 0;


/* Particle class */

class Particle{

    constructor(x,y,color,size){

        this.x=x;
        this.y=y;

        this.tx=x;
        this.ty=y;

        this.vx=0;
        this.vy=0;

        this.size=size || 1;
        this.color=color || "255,255,255";

        this.alpha=Math.random();

        this.speed=.02 + Math.random()*.05;

        this.life=1;
        this.decay=.001 + Math.random()*.003;

        this.angle=Math.random()*Math.PI*2;

        this.orbit=Math.random()*100;
    }


    update(){

        this.x += (this.tx-this.x)*this.speed;
        this.y += (this.ty-this.y)*this.speed;

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= .97;
        this.vy *= .97;
    }


    draw(){

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(${this.color},${this.alpha})`;

        ctx.shadowBlur = this.size * 5;

        ctx.shadowColor =
        `rgb(${this.color})`;

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }

}


/* =====================================================
   CREATE STAR FIELD
===================================================== */

function createStars(){

    stars=[];

    for(let i=0;i<1800;i++){

        stars.push({

            x:Math.random()*W,
            y:Math.random()*H,

            size:Math.random()*1.8+.2,

            alpha:Math.random(),

            speed:Math.random()*.25+.02

        });

    }

}

createStars();


function drawStars(){

    for(const s of stars){

        s.y += s.speed;

        if(s.y>H){
            s.y=0;
            s.x=Math.random()*W;
        }

        ctx.fillStyle=
        `rgba(190,220,255,${s.alpha*.7})`;

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );
    }
}


/* =====================================================
   INFINITY VOID
===================================================== */

function infinityVoid(){

    resetParticles();

    mode="infinity";

    animationStart=performance.now();

    document.getElementById("status").innerText =
    "∞ INFINITY VOID ACTIVATED";


    const cx=W/2;
    const cy=H/2;

    /*
    MAIN PARTICLE RING
    */

    for(let i=0;i<3500;i++){

        const angle=Math.random()*Math.PI*2;

        /*
        Dense ring distribution
        */

        const radius =
        190 + (Math.random()-.5)*35;

        const x =
        cx + Math.cos(angle)*radius;

        const y =
        cy + Math.sin(angle)*radius;

        const p=new Particle(

            cx + (Math.random()-.5)*40,

            cy + (Math.random()-.5)*40,

            Math.random()>.5
            ? "230,245,255"
            : "110,220,255",

            Math.random()*1.5+.4
        );

        p.tx=x;
        p.ty=y;

        p.angle=angle;
        p.orbit=radius;

        particles.push(p);
    }


    /*
    SPACE PARTICLES
    */

    for(let i=0;i<3500;i++){

        const p=new Particle(

            cx,

            cy,

            Math.random()>.8
            ? "80,190,255"
            : "220,240,255",

            Math.random()*1.3+.25
        );

        p.tx=Math.random()*W;
        p.ty=Math.random()*H;

        particles.push(p);
    }

}


/* =====================================================
   RED TECHNIQUE
===================================================== */

function redTechnique(){

    resetParticles();

    mode="red";

    animationStart=performance.now();

    document.getElementById("status").innerText =
    "🔴 CURSED TECHNIQUE: RED";


    const cx=W/2;
    const cy=H/2;


    /*
    CENTRAL ENERGY CORE
    */

    for(let i=0;i<3000;i++){

        const angle=Math.random()*Math.PI*2;

        /*
        Dense energy sphere
        */

        const radius =
        Math.pow(Math.random(),2)*120;

        const x=
        cx + Math.cos(angle)*radius;

        const y=
        cy + Math.sin(angle)*radius;

        const p=new Particle(

            cx,

            cy,

            Math.random()>.5
            ? "255,30,30"
            : "255,180,180",

            Math.random()*1.8+.3
        );

        p.tx=x;
        p.ty=y;

        particles.push(p);
    }


    /*
    PARTICLE RINGS
    */

    for(let ring=0;ring<5;ring++){

        const baseRadius=150 + ring*65;

        for(let i=0;i<850;i++){

            const angle=
            Math.random()*Math.PI*2;

            const radius=
            baseRadius +
            (Math.random()-.5)*10;

            const p=new Particle(

                cx,

                cy,

                ring%2===0
                ? "255,25,25"
                : "180,0,0",

                Math.random()*1.4+.3
            );

            p.tx=
            cx+Math.cos(angle)*radius;

            p.ty=
            cy+Math.sin(angle)*radius;

            p.ring=true;
            p.angle=angle;
            p.radius=radius;
            p.ringIndex=ring;

            particles.push(p);
        }
    }


    /*
    RED ENERGY CLOUD
    */

    for(let i=0;i<2500;i++){

        const angle=Math.random()*Math.PI*2;

        const radius=
        250+Math.random()*400;

        const p=new Particle(

            cx,

            cy,

            "255,30,60",

            Math.random()*1.2+.2
        );

        p.tx=
        cx+Math.cos(angle)*radius;

        p.ty=
        cy+Math.sin(angle)*radius;

        particles.push(p);
    }

}


/* =====================================================
   RESET
===================================================== */

function resetParticles(){

    particles=[];

    mode="idle";

    document.getElementById("status").innerText =
    "SYSTEM READY";
}


function resetScene(){

    resetParticles();

}


/* =====================================================
   INFINITY ANIMATION
===================================================== */

function updateInfinity(time){

    const cx=W/2;
    const cy=H/2;

    const elapsed=(time-animationStart)/1000;


    particles.forEach((p,index)=>{

        /*
        Pulsating portal
        */

        if(index<3500){

            const pulse=
            Math.sin(
                elapsed*2+
                index*.01
            )*8;

            const angle=
            p.angle+elapsed*.12;

            p.tx=
            cx+
            Math.cos(angle)*
            (p.orbit+pulse);

            p.ty=
            cy+
            Math.sin(angle)*
            (p.orbit+pulse);
        }


        p.update();
        p.draw();

    });


    /*
    Central dark void
    */

    const gradient=
    ctx.createRadialGradient(
        cx,cy,10,
        cx,cy,175
    );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,.9)"
    );

    gradient.addColorStop(
        .7,
        "rgba(0,0,10,.45)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        190,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   RED ANIMATION
===================================================== */

function updateRed(time){

    const cx=W/2;
    const cy=H/2;

    const elapsed=
    (time-animationStart)/1000;


    particles.forEach((p,index)=>{

        if(p.ring){

            const speed=
            .2+p.ringIndex*.06;

            p.angle+=speed*.015;

            const pulse=
            Math.sin(
                elapsed*3+
                index*.02
            )*12;

            p.tx=
            cx+
            Math.cos(p.angle)*
            (p.radius+pulse);

            p.ty=
            cy+
            Math.sin(p.angle)*
            (p.radius+pulse);
        }

        p.update();
        p.draw();

    });


    /*
    GLOWING RED CORE
    */

    const pulse=
    1+
    Math.sin(elapsed*5)*.12;

    const gradient=
    ctx.createRadialGradient(

        cx,
        cy,
        5,

        cx,
        cy,
        150*pulse

    );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        .12,
        "rgba(255,220,220,1)"
    );

    gradient.addColorStop(
        .35,
        "rgba(255,30,30,.9)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,0,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        150*pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   IDLE PARTICLES
===================================================== */

function drawIdle(){

    const cx=W/2;
    const cy=H/2;

    /*
    Subtle cinematic floating particles
    */

    for(let i=0;i<150;i++){

        const x=
        (Math.sin(Date.now()*.0002+i)*.5+.5)*W;

        const y=
        (Math.cos(Date.now()*.00015+i)*.5+.5)*H;

        ctx.fillStyle=
        "rgba(100,200,255,.25)";

        ctx.fillRect(x,y,1,1);
    }

}


/* =====================================================
   MAIN LOOP
===================================================== */

function animate(time){

    requestAnimationFrame(animate);


    /*
    TRAIL BACKGROUND
    */

    ctx.fillStyle=
    "rgba(0,0,0,.18)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
    BACKGROUND
    */

    if(mode==="infinity"){

        drawStars();

        updateInfinity(time);

    }

    else if(mode==="red"){

        updateRed(time);

    }

    else{

        drawIdle();

    }

}

animate();


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
"keydown",
(e)=>{

    if(e.key==="i" || e.key==="I"){

        infinityVoid();

    }

    if(e.key==="r" || e.key==="R"){

        redTechnique();

    }

    if(e.code==="Space"){

        resetScene();

    }

});


/* =====================================================
   AUTO DEMO
===================================================== */

setTimeout(()=>{

    infinityVoid();

},1500);

</script>

</body>
</html>
