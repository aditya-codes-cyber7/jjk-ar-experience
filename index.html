<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJK AR Experience</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

video{
  transform:scaleX(-1);
  filter:brightness(.75) contrast(1.15);
}

#handCanvas{
  z-index:5;
  transform:scaleX(-1);
  transition:opacity .4s;
}

#fxCanvas{
  z-index:10;
  pointer-events:none;
}

/* RED ATMOSPHERE */
#redAtmosphere{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s ease;
  background:
    radial-gradient(circle at 50% 45%,
      rgba(255,30,50,.30),
      rgba(100,0,15,.45) 45%,
      rgba(15,0,5,.82) 100%);
  mix-blend-mode:screen;
}

#redAtmosphere.active{
  opacity:1;
  animation:atmospherePulse 2s infinite alternate;
}

@keyframes atmospherePulse{
  from{filter:brightness(.8)}
  to{filter:brightness(1.3)}
}

/* UI */
#ui{
  position:absolute;
  z-index:30;
  top:25px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

h1{
  font-size:26px;
  letter-spacing:6px;
  text-shadow:0 0 20px #ff1744;
}

#status{
  margin-top:10px;
  font-size:12px;
  letter-spacing:3px;
  color:#ffb0ba;
}

#startBtn{
  position:absolute;
  z-index:50;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:18px 30px;
  border:1px solid #ff1744;
  background:rgba(30,0,5,.92);
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  letter-spacing:3px;
  box-shadow:0 0 30px #ff1744;
}

#domainText{
  position:absolute;
  z-index:40;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.7);
  opacity:0;
  text-align:center;
  pointer-events:none;
}

#domainText.active{
  animation:textReveal 1.8s forwards;
}

@keyframes textReveal{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4);filter:blur(20px)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.1);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.japanese{
  font-size:clamp(50px,10vw,120px);
  color:#fff;
  text-shadow:0 0 25px #ff1744,0 0 80px #a00020;
}

.domain{
  margin-top:12px;
  letter-spacing:9px;
  font-size:17px;
  color:#ffc0c8;
}

#flash{
  position:absolute;
  inset:0;
  z-index:45;
  background:#ff3050;
  opacity:0;
  pointer-events:none;
}

#flash.active{
  animation:flash .6s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:.75}
  100%{opacity:0}
}
</style>
</head>

<body>

<div id="app">

  <video id="webcam" autoplay playsinline></video>

  <canvas id="handCanvas"></canvas>

  <div id="redAtmosphere"></div>

  <canvas id="fxCanvas"></canvas>

  <div id="domainText">
    <div class="japanese">術式展開</div>
    <div class="domain">CURSED ENERGY</div>
  </div>

  <div id="flash"></div>

  <div id="ui">
    <h1>JJK AR EXPERIENCE</h1>
    <div id="status">SYSTEM READY</div>
  </div>

  <button id="startBtn">ACTIVATE CURSED ENERGY</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("webcam");

const handCanvas = document.getElementById("handCanvas");
const handCtx = handCanvas.getContext("2d");

const fxCanvas = document.getElementById("fxCanvas");
const fx = fxCanvas.getContext("2d");

const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

const atmosphere = document.getElementById("redAtmosphere");
const flash = document.getElementById("flash");
const domainText = document.getElementById("domainText");

let active = false;
let fxRunning = false;
let animationId = null;

let particles = [];
let ambientParticles = [];
let timeStart = 0;


/* =========================
   RESIZE
========================= */

function resize(){

  handCanvas.width = innerWidth;
  handCanvas.height = innerHeight;

  fxCanvas.width = innerWidth;
  fxCanvas.height = innerHeight;

}

addEventListener("resize",resize);
resize();


/* =========================
   ORBIT ENERGY PARTICLE
========================= */

class OrbitParticle{

  constructor(cx,cy){

    this.cx=cx;
    this.cy=cy;

    this.angle=Math.random()*Math.PI*2;

    this.radius=80+Math.random()*280;

    this.speed=
      (0.008+Math.random()*0.02) *
      (Math.random()>.5?1:-1);

    this.size=1+Math.random()*3;

    this.life=.5+Math.random()*.5;

    this.color=
      Math.random()>.35
      ? "255,255,255"
      : "255,30,50";

    this.history=[];

  }

  update(){

    this.angle+=this.speed;

    this.radius+=Math.sin(this.angle*3)*.8;

    this.x=this.cx+
      Math.cos(this.angle)*this.radius;

    this.y=this.cy+
      Math.sin(this.angle)*this.radius*.55;

    this.history.push({
      x:this.x,
      y:this.y
    });

    if(this.history.length>12){
      this.history.shift();
    }

  }

  draw(){

    /* TRAIL */

    if(this.history.length>2){

      fx.beginPath();

      fx.moveTo(
        this.history[0].x,
        this.history[0].y
      );

      for(let i=1;i<this.history.length;i++){

        fx.lineTo(
          this.history[i].x,
          this.history[i].y
        );

      }

      fx.strokeStyle=
        `rgba(${this.color},.25)`;

      fx.lineWidth=1;

      fx.shadowBlur=10;

      fx.shadowColor=
        `rgb(${this.color})`;

      fx.stroke();

    }


    /* PARTICLE */

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    fx.fillStyle=
      `rgba(${this.color},${this.life})`;

    fx.shadowBlur=18;

    fx.shadowColor=
      `rgb(${this.color})`;

    fx.fill();

  }

}


/* =========================
   AMBIENT PARTICLES
========================= */

class AmbientParticle{

  constructor(){

    this.x=Math.random()*fxCanvas.width;
    this.y=Math.random()*fxCanvas.height;

    this.size=Math.random()*2+0.5;

    this.speedX=(Math.random()-.5)*.7;
    this.speedY=(Math.random()-.5)*.7;

    this.alpha=.15+Math.random()*.5;

    this.red=Math.random()>.4;

  }

  update(){

    this.x+=this.speedX;
    this.y+=this.speedY;

    if(this.x<0||this.x>fxCanvas.width||
       this.y<0||this.y>fxCanvas.height){

      this.x=Math.random()*fxCanvas.width;
      this.y=Math.random()*fxCanvas.height;

    }

  }

  draw(){

    fx.beginPath();

    fx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    const color=this.red
      ? "255,40,60"
      : "255,255,255";

    fx.fillStyle=
      `rgba(${color},${this.alpha})`;

    fx.shadowBlur=8;

    fx.shadowColor=
      `rgb(${color})`;

    fx.fill();

  }

}


/* =========================
   CREATE PARTICLES
========================= */

function createEnergy(cx,cy){

  particles=[];

  for(let i=0;i<180;i++){

    particles.push(
      new OrbitParticle(cx,cy)
    );

  }


  ambientParticles=[];

  for(let i=0;i<250;i++){

    ambientParticles.push(
      new AmbientParticle()
    );

  }

}


/* =========================
   DRAW ENERGY CORE
========================= */

function drawCore(cx,cy,time){

  const pulse=
    45+Math.sin(time*.008)*10;


  /* OUTER GLOW */

  const gradient=
    fx.createRadialGradient(
      cx,cy,0,
      cx,cy,pulse*3
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    .12,
    "rgba(255,50,60,.95)"
  );

  gradient.addColorStop(
    .4,
    "rgba(255,0,35,.5)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,0,30,0)"
  );


  fx.fillStyle=gradient;

  fx.beginPath();

  fx.arc(
    cx,cy,
    pulse*3,
    0,
    Math.PI*2
  );

  fx.fill();


  /* CORE */

  fx.beginPath();

  fx.arc(
    cx,cy,
    pulse,
    0,
    Math.PI*2
  );

  fx.fillStyle="#ff1535";

  fx.shadowBlur=50;

  fx.shadowColor="#ff002b";

  fx.fill();


  /* ROTATING RINGS */

  for(let i=0;i<4;i++){

    fx.beginPath();

    fx.ellipse(
      cx,
      cy,
      pulse*(1.8+i*.35),
      pulse*(.55+i*.12),
      time*.002*(i%2?1:-1)+i,
      0,
      Math.PI*2
    );

    fx.strokeStyle=
      `rgba(255,${80+i*30},${90+i*20},.55)`;

    fx.lineWidth=1.5;

    fx.shadowBlur=12;

    fx.shadowColor="#ff1744";

    fx.stroke();

  }

}


/* =========================
   ENERGY LIGHTNING
========================= */

function drawLightning(cx,cy,time){

  fx.lineWidth=1.5;

  for(let b=0;b<10;b++){

    const angle=
      time*.001+b*(Math.PI*2/10);

    let x=cx;
    let y=cy;

    fx.beginPath();

    fx.moveTo(x,y);

    for(let i=0;i<8;i++){

      const distance=
        35+i*30;

      x+=
        Math.cos(angle+
        (Math.random()-.5)*.5)
        *distance;

      y+=
        Math.sin(angle+
        (Math.random()-.5)*.5)
        *distance;

      fx.lineTo(x,y);

    }

    fx.strokeStyle=
      "rgba(255,190,190,.45)";

    fx.shadowBlur=15;

    fx.shadowColor="#ff1744";

    fx.stroke();

  }

}


/* =========================
   MAIN EFFECT
========================= */

function animateEnergy(time){

  if(!fxRunning)return;


  fx.fillStyle=
    "rgba(5,0,2,.12)";

  fx.fillRect(
    0,
    0,
    fxCanvas.width,
    fxCanvas.height
  );


  const cx=fxCanvas.width/2;
  const cy=fxCanvas.height*.48;


  /* AMBIENT */

  ambientParticles.forEach(p=>{

    p.update();
    p.draw();

  });


  /* ORBIT PARTICLES */

  particles.forEach(p=>{

    p.cx=cx;
    p.cy=cy;

    p.update();
    p.draw();

  });


  /* CORE */

  drawCore(cx,cy,time);


  /* LIGHTNING */

  if(Math.random()>.45){

    drawLightning(cx,cy,time);

  }


  animationId=
    requestAnimationFrame(
      animateEnergy
    );

}


/* =========================
   ACTIVATE
========================= */

function activate(){

  if(active)return;

  active=true;

  handCanvas.style.opacity="0";

  status.innerText=
    "CURSED ENERGY DETECTED";

  atmosphere.classList.add("active");


  setTimeout(()=>{

    flash.classList.add("active");

    const cx=fxCanvas.width/2;
    const cy=fxCanvas.height*.48;

    createEnergy(cx,cy);

    fxRunning=true;

    timeStart=performance.now();

    animationId=
      requestAnimationFrame(
        animateEnergy
      );

    status.innerText=
      "CURSED ENERGY ACTIVE";

  },500);


  setTimeout(()=>{

    domainText.classList.add("active");

  },1800);


  /* RESET */

  setTimeout(()=>{

    fxRunning=false;

    cancelAnimationFrame(
      animationId
    );

    fx.clearRect(
      0,0,
      fxCanvas.width,
      fxCanvas.height
    );

    atmosphere.classList.remove("active");

    domainText.classList.remove("active");

    handCanvas.style.opacity="1";

    status.innerText=
      "SHOW GOJO HAND SIGN";

    active=false;

  },12000);

}


/* =========================
   GOJO GESTURE
========================= */

function isGojoPose(hand){

  const indexUp=
    hand[8].y<hand[6].y;

  const middleUp=
    hand[12].y<hand[10].y;

  const ringDown=
    hand[16].y>hand[14].y;

  const pinkyDown=
    hand[20].y>hand[18].y;

  return indexUp &&
         middleUp &&
         ringDown &&
         pinkyDown;

}


/* =========================
   MEDIAPIPE
========================= */

const hands=new Hands({

  locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});

hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.7,

  minTrackingConfidence:.7

});

hands.onResults(results=>{

  handCtx.clearRect(
    0,0,
    handCanvas.width,
    handCanvas.height
  );

  if(!results.multiHandLandmarks)return;

  let detected=false;

  results.multiHandLandmarks.forEach(hand=>{

    if(!active){

      drawConnectors(
        handCtx,
        hand,
        HAND_CONNECTIONS,
        {
          color:"#ff3050",
          lineWidth:3
        }
      );

      drawLandmarks(
        handCtx,
        hand,
        {
          color:"#fff",
          radius:4
        }
      );

    }

    if(isGojoPose(hand)){

      detected=true;

    }

  });

  if(detected&&!active){

    activate();

  }

  else if(!active){

    status.innerText=
      "SHOW GOJO HAND SIGN";

  }

});


/* =========================
   CAMERA
========================= */

startBtn.addEventListener(
  "click",
  async()=>{

    try{

      status.innerText=
        "ACTIVATING CAMERA...";

      const stream=
        await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });

      video.srcObject=stream;

      await video.play();

      startBtn.style.display="none";

      const camera=
        new Camera(video,{

          onFrame:async()=>{

            await hands.send({
              image:video
            });

          },

          width:1280,
          height:720

        });

      camera.start();

      status.innerText=
        "SHOW GOJO HAND SIGN";

    }

    catch(error){

      console.error(error);

      status.innerText=
        "CAMERA ACCESS DENIED";

    }

  }
);

</script>

</body>
</html>
