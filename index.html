<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR EXPERIENCE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Share+Tech+Mono&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#020406;

/* =========================
   MAIN CANVAS
========================= */

#effectCanvas{

    inset:0;
    width:100vw;
    height:100vh;

    position:fixed;

    background:
    radial-gradient(circle at center,#07101a 0%,#020406 55%,#000 100%);
}

.background::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
    linear-gradient(rgba(0,180,255,.08) 1px,transparent 1px),

}

/* =========================
   HEADER
========================= */

.header{
    position:fixed;
    top:40px;
    width:100%;
    text-align:center;
    z-index:10;
}

.header h1{
    font-size:30px;
    letter-spacing:12px;
    font-weight:800;
    text-shadow:0 0 20px rgba(255,255,255,.5);
}

.header p{
    margin-top:12px;
    color:#72dfff;
    font-size:9px;
    letter-spacing:7px;
}

/* =========================
   STATUS
========================= */

.status{
    position:fixed;
    bottom:38px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    font-family:'Share Tech Mono';
    letter-spacing:5px;

    font-size:13px;

/* =========================
   CAMERA BOX
========================= */

.camera-box{
    position:fixed;
    left:28px;
    bottom:28px;
    width:260px;

    border:1px solid rgba(83,220,255,.5);
    border-radius:18px;

    overflow:hidden;

    background:#020609;

    box-shadow:
    0 0 30px rgba(0,200,255,.15),

#video{

/* =========================

========================= */

.controls{

.technique-name{

    text-align:center;

.technique-name h2{

/* =========================
   FLASH
========================= */

#flash{

    pointer-events:none;

    opacity:0;
}

.red-flash{
    background:#ff0000;
}

.blue-flash{
    background:#0066ff;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="header">

<h1>呪 術 廻 戦</h1>

<p>CURSED TECHNIQUE EXPERIENCE</p>

</div>


<canvas id="effectCanvas"></canvas>


<div id="flash"></div>


<div class="technique-name" id="techniqueName">

<h2 id="techniqueTitle">TECHNIQUE</h2>

<p id="techniqueSub">CURSED ENERGY</p>

</div>

AR POSE DETECTION

SYSTEM INITIALIZING
</div>

</div>


<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   CANVAS SETUP
===================================================== */

const canvas = document.getElementById("effectCanvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize",()=>{

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

});


/* =====================================================
   VARIABLES
===================================================== */

let particles = [];
let slashes = [];
let rings = [];

let activeTechnique = null;

let animationId;


/* =====================================================
   PARTICLE CLASS
===================================================== */

class Particle{

    constructor(x,y,color,options={}){

        this.x=x;
        this.y=y;

        this.vx=options.vx ?? (Math.random()-.5)*4;
        this.vy=options.vy ?? (Math.random()-.5)*4;

        this.size=options.size ?? Math.random()*3+1;

        this.color=color;

        this.life=options.life ?? 150;

        this.maxLife=this.life;

        this.gravity=options.gravity ?? 0;

        this.type=options.type ?? "normal";

        this.angle=Math.random()*Math.PI*2;

        this.radius=options.radius ?? 0;

    }

    update(){

        this.x+=this.vx;
        this.y+=this.vy;

        this.vy+=this.gravity;

        this.life--;

    }

    draw(){

        let alpha=this.life/this.maxLife;

        ctx.globalAlpha=alpha;

        ctx.fillStyle=this.color;

        ctx.shadowBlur=15;

        ctx.shadowColor=this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.globalAlpha=1;

    }

}


/* =====================================================
   SLASH CLASS
===================================================== */

class Slash{

    constructor(){

        this.x=Math.random()*W;
        this.y=Math.random()*H;

        this.length=Math.random()*500+300;

        this.angle=
        (Math.random()*.6-.3) + Math.PI/4;

        this.speed=Math.random()*35+25;

        this.life=35;

        this.maxLife=this.life;

        this.width=Math.random()*3+1;

    }

    update(){

        this.x+=Math.cos(this.angle)*this.speed;

        this.y+=Math.sin(this.angle)*this.speed;

        this.life--;

    }

    draw(){

        let alpha=this.life/this.maxLife;

        let x2=this.x+
        Math.cos(this.angle)*this.length;

        let y2=this.y+
        Math.sin(this.angle)*this.length;

        ctx.save();

        ctx.globalAlpha=alpha;

        /* RED GLOW */

        ctx.shadowBlur=30;

        ctx.shadowColor="#ff0000";

        ctx.strokeStyle="#ff1a1a";

        ctx.lineWidth=this.width;

        ctx.beginPath();

        ctx.moveTo(this.x,this.y);

        ctx.lineTo(x2,y2);

        ctx.stroke();


        /* WHITE HOT CENTER */

        ctx.shadowBlur=10;

        ctx.strokeStyle="#ffffff";

        ctx.lineWidth=.7;

        ctx.beginPath();

        ctx.moveTo(this.x,this.y);

        ctx.lineTo(x2,y2);

        ctx.stroke();

        ctx.restore();

    }

}


/* =====================================================
   RING CLASS
===================================================== */

class Ring{

    constructor(x,y,color,maxRadius){

        this.x=x;

        this.y=y;

        this.radius=10;

        this.maxRadius=maxRadius;

        this.color=color;

        this.life=100;

        this.maxLife=this.life;

    }

    update(){

        this.radius+=
        (this.maxRadius-this.radius)*.06;

        this.life--;

    }

    draw(){

        ctx.save();

        ctx.globalAlpha=
        this.life/this.maxLife;

        ctx.strokeStyle=this.color;

        ctx.lineWidth=2;

        ctx.shadowBlur=25;

        ctx.shadowColor=this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }

}


/* =====================================================
   CLEAR EFFECT
===================================================== */

function clearEffects(){

    particles=[];
    slashes=[];
    rings=[];

    activeTechnique=null;

    document
    .getElementById("status")
    .innerText="SYSTEM READY";

}


/* =====================================================
   SHOW TECHNIQUE NAME
===================================================== */

function showTechnique(title,sub,color){

    const box=
    document.getElementById("techniqueName");

    document
    .getElementById("techniqueTitle")
    .innerText=title;

    document
    .getElementById("techniqueSub")
    .innerText=sub;

    box.querySelector("h2").style.color=color;

    box.classList.add("show");

    setTimeout(()=>{
        box.classList.remove("show");
    },2500);

}


/* =====================================================
   SCREEN FLASH
===================================================== */

function flash(color){

    const f=document.getElementById("flash");

    f.style.background=color;

    f.style.opacity=".65";

    setTimeout(()=>{
        f.style.transition=".8s";
        f.style.opacity="0";
    },80);

}


/* =====================================================
   RED TECHNIQUE
===================================================== */

function redTechnique(){

    clearEffects();

    activeTechnique="RED";

    showTechnique(
        "RED",
        "CURSED TECHNIQUE • REPULSION",
        "#ff2020"
    );

    flash("#ff0000");

    document
    .getElementById("status")
    .innerText="RED TECHNIQUE ACTIVATED";


    let cx=W/2;
    let cy=H/2;


    /* CENTRAL CORE */

    for(let i=0;i<1800;i++){

        let angle=Math.random()*Math.PI*2;

        let radius=Math.pow(
            Math.random(),
            .45
        )*220;

        let x=
        cx+
        Math.cos(angle)*radius;

        let y=
        cy+
        Math.sin(angle)*radius;

        let speed=
        radius*.012;

        particles.push(

            new Particle(

                x,
                y,

                Math.random()>.35
                ? "#ff1111"
                : "#ffffff",

                {

                    vx:
                    Math.cos(angle)*speed,

                    vy:
                    Math.sin(angle)*speed,

                    size:
                    Math.random()*2.5+.5,

                    life:
                    170

                }

            )

        );

    }


    /* PARTICLE RINGS */

    for(let r=70;r<400;r+=55){

        for(let i=0;i<220;i++){

            let angle=
            Math.random()*Math.PI*2;

            let radius=
            r+(Math.random()-.5)*15;

            particles.push(

                new Particle(

                    cx+
                    Math.cos(angle)*radius,

                    cy+
                    Math.sin(angle)*radius,

                    "#ff2020",

                    {

                        vx:
                        Math.cos(angle)*.5,

                        vy:
                        Math.sin(angle)*.5,

                        size:
                        Math.random()*2,

                        life:
                        220

                    }

                )

            );

        }

    }


    rings.push(
        new Ring(
            cx,cy,
            "#ff1111",
            300
        )
    );

}


/* =====================================================
   UNLIMITED VOID
===================================================== */

function unlimitedVoid(){

    clearEffects();

    activeTechnique="VOID";

    showTechnique(
        "UNLIMITED VOID",
        "DOMAIN EXPANSION",
        "#8fefff"
    );

    flash("#0066ff");


    document
    .getElementById("status")
    .innerText="DOMAIN EXPANSION";


    let cx=W/2;
    let cy=H/2;


    /* STAR FIELD */

    for(let i=0;i<3500;i++){

        let angle=
        Math.random()*Math.PI*2;

        let radius=
        Math.random()*
        Math.max(W,H)*.8;

        particles.push(

            new Particle(

                cx+
                Math.cos(angle)*radius,

                cy+
                Math.sin(angle)*radius,

                Math.random()>.8
                ? "#55ccff"
                : "#ffffff",

                {

                    vx:
                    -Math.cos(angle)*.25,

                    vy:
                    -Math.sin(angle)*.25,

                    size:
                    Math.random()*2+.4,

                    life:
                    500

                }

            )

        );

    }


    /* CENTRAL VOID RING */

    for(let i=0;i<1000;i++){

        let angle=
        Math.random()*Math.PI*2;

        let radius=
        180+
        (Math.random()-.5)*30;

        particles.push(

            new Particle(

                cx+
                Math.cos(angle)*radius,

                cy+
                Math.sin(angle)*radius,

                "#ffffff",

                {

                    vx:
                    Math.cos(angle)*.2,

                    vy:
                    Math.sin(angle)*.2,

                    size:
                    Math.random()*2,

                    life:
                    350

                }

            )

        );

    }


    rings.push(
        new Ring(
            cx,
            cy,
            "#ffffff",
            230
        )
    );

}


/* =====================================================
   MALEVOLENT SHRINE
===================================================== */

function malevolentShrine(){

    clearEffects();

    activeTechnique="SHRINE";

    showTechnique(
        "MALEVOLENT SHRINE",
        "DOMAIN EXPANSION",
        "#ff1515"
    );

    flash("#700000");

    document
    .getElementById("status")
    .innerText="MALEVOLENT SHRINE ACTIVATED";


    let cx=W/2;
    let cy=H/2;


    /*
    =================================
    RED PARTICLE GROUND
    =================================
    */

    for(let i=0;i<2500;i++){

        let x=Math.random()*W;

        let y=
        H*.72+
        Math.random()*H*.3;

        particles.push(

            new Particle(

                x,
                y,

                Math.random()>.7
                ? "#ff4444"
                : "#b50000",

                {

                    vx:
                    (Math.random()-.5)*.6,

                    vy:
                    -Math.random()*.3,

                    size:
                    Math.random()*2.5+.5,

                    life:
                    400

                }

            )

        );

    }


    /*
    =================================
    SHRINE ROOF PARTICLES
    =================================
    */

    for(let i=0;i<1200;i++){

        let t=Math.random();

        let x=
        cx+
        (t-.5)*420;

        let roofY=
        cy-120-
        Math.sin(
            t*Math.PI
        )*110;

        let y=
        roofY+
        (Math.random()-.5)*25;

        particles.push(

            new Particle(

                x,
                y,

                Math.random()>.3
                ? "#ff1515"
                : "#ffffff",

                {

                    vx:
                    (Math.random()-.5)*.4,

                    vy:
                    (Math.random()-.5)*.4,

                    size:
                    Math.random()*2+.5,

                    life:
                    300

                }

            )

        );

    }


    /*
    =================================
    SHRINE PILLARS
    =================================
    */

    for(let i=0;i<700;i++){

        let side=
        Math.random()>.5?1:-1;

        let x=
        cx+
        side*
        (110+
        Math.random()*25);

        let y=
        cy-110+
        Math.random()*330;

        particles.push(

            new Particle(

                x,
                y,

                "#ffffff",

                {

                    vx:
                    (Math.random()-.5)*.2,

                    vy:
                    (Math.random()-.5)*.2,

                    size:
                    Math.random()*1.8+.5,

                    life:
                    350

                }

            )

        );

    }


    /*
    =================================
    CENTRAL RED CORE
    =================================
    */

    for(let i=0;i<1500;i++){

        let angle=
        Math.random()*Math.PI*2;

        let radius=
        Math.pow(Math.random(),.5)*100;

        particles.push(

            new Particle(

                cx+
                Math.cos(angle)*radius,

                cy+
                Math.sin(angle)*radius,

                Math.random()>.25
                ? "#ff1111"
                : "#ffffff",

                {

                    vx:
                    Math.cos(angle)*1.2,

                    vy:
                    Math.sin(angle)*1.2,

                    size:
                    Math.random()*2.5+.5,

                    life:
                    220

                }

            )

        );

    }


    /*
    =================================
    ANIME CUTTING SLASHES
    =================================
    */

    let slashInterval=setInterval(()=>{

        if(activeTechnique!=="SHRINE"){

            clearInterval(slashInterval);

            return;

        }

        for(let i=0;i<3;i++){

            setTimeout(()=>{

                slashes.push(
                    new Slash()
                );

            },i*100);

        }

    },700);

}


/* =====================================================
   PARTICLE ANIMATION
===================================================== */

function animate(){

    ctx.clearRect(0,0,W,H);


    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.update();

        p.draw();

        if(p.life<=0){

            particles.splice(i,1);

        }

    }


    /* RINGS */

    for(let i=rings.length-1;i>=0;i--){

        let r=rings[i];

        r.update();

        r.draw();

        if(r.life<=0){

            rings.splice(i,1);

        }

    }


    /* SLASHES */

    for(let i=slashes.length-1;i>=0;i--){

        let s=slashes[i];

        s.update();

        s.draw();

        if(s.life<=0){

            slashes.splice(i,1);

        }

    }


    /*
    SHRINE PARTICLE REGENERATION
    */

    if(activeTechnique==="SHRINE"){

        if(Math.random()>.45){

            let x=Math.random()*W;

            let y=H*.7+Math.random()*H*.3;

            particles.push(

                new Particle(

                    x,
                    y,

                    "#ff1111",

                    {

                        vx:(Math.random()-.5)*.8,

                        vy:-Math.random()*.5,

                        size:Math.random()*2,

                        life:150

                    }

                )

            );

        }

    }


    requestAnimationFrame(animate);

}

animate();


/* =====================================================
   KEYBOARD TEST CONTROLS
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="1"){

        redTechnique();

    }

    if(e.key==="2"){

        unlimitedVoid();

    }

    if(e.key==="3"){

        malevolentShrine();

    }

    if(e.code==="Space"){

        clearEffects();

    }

});


/* =====================================================
   CAMERA + HAND DETECTION
===================================================== */

const video=
document.getElementById("video");

const handCanvas=
document.getElementById("handCanvas");

const handCtx=
handCanvas.getContext("2d");


function resizeHandCanvas(){

    handCanvas.width=
    handCanvas.clientWidth;

    handCanvas.height=
    handCanvas.clientHeight;

}

window.addEventListener(
    "resize",
    resizeHandCanvas
);

resizeHandCanvas();


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

let gestureCooldown=false;

function onResults(results){

    handCtx.clearRect(
        0,
        0,
        handCanvas.width,
        handCanvas.height
    );


    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0
    ){

        document
        .getElementById("status")
        .innerText=
        activeTechnique
        ? "TECHNIQUE ACTIVE"
        : "SEARCHING FOR HAND";

        return;

    }


    document
    .getElementById("status")
    .innerText=
    "HAND DETECTED";


    for(
        const landmarks
        of results.multiHandLandmarks
    ){

        drawHand(landmarks);

        detectGesture(landmarks);

    }

}


/* =====================================================
   DRAW HAND SKELETON
===================================================== */

function drawHand(lm){

    const connections=[

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [5,9],[9,10],[10,11],[11,12],

        [9,13],[13,14],[14,15],[15,16],

        [13,17],[17,18],[18,19],[19,20],

        [0,17]

    ];


    handCtx.strokeStyle="#00eaff";

    handCtx.lineWidth=2;

    handCtx.shadowBlur=10;

    handCtx.shadowColor="#00eaff";


    connections.forEach(c=>{

        const a=lm[c[0]];

        const b=lm[c[1]];

        handCtx.beginPath();

        handCtx.moveTo(

            a.x*handCanvas.width,

            a.y*handCanvas.height

        );

        handCtx.lineTo(

            b.x*handCanvas.width,

            b.y*handCanvas.height

        );

        handCtx.stroke();

    });


    lm.forEach(p=>{

        handCtx.fillStyle="white";

        handCtx.beginPath();

        handCtx.arc(

            p.x*handCanvas.width,

            p.y*handCanvas.height,

            4,

            0,

            Math.PI*2

        );

        handCtx.fill();

    });


    handCtx.shadowBlur=0;

}


/* =====================================================
   DISTANCE FUNCTION
===================================================== */

function distance(a,b){

    return Math.sqrt(

        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)

    );

}


/* =====================================================
   GESTURE DETECTION
===================================================== */

function detectGesture(lm){

    if(gestureCooldown) return;


    const wrist=lm[0];

    const thumb=lm[4];

    const indexTip=lm[8];

    const indexPip=lm[6];

    const middleTip=lm[12];

    const middlePip=lm[10];

    const ringTip=lm[16];

    const ringPip=lm[14];

    const pinkyTip=lm[20];

    const pinkyPip=lm[18];


    /* Finger extended */

    const indexExtended=
    indexTip.y < indexPip.y;

    const middleExtended=
    middleTip.y < middlePip.y;

    const ringExtended=
    ringTip.y < ringPip.y;

    const pinkyExtended=
    pinkyTip.y < pinkyPip.y;


    /*
    PINCH
    = RED TECHNIQUE
    */

    const pinchDistance=
    distance(thumb,indexTip);


    /*
    OPEN HAND
    = UNLIMITED VOID
    */

    const openHand=
    indexExtended &&
    middleExtended &&
    ringExtended &&
    pinkyExtended;


    /*
    TWO FINGER SIGN
    = MALEVOLENT SHRINE
    */

    const twoFinger=
    indexExtended &&
    middleExtended &&
    !ringExtended &&
    !pinkyExtended;


    if(pinchDistance<0.06){

        triggerGesture("RED");

    }

    else if(openHand){

        triggerGesture("VOID");

    }

    else if(twoFinger){

        triggerGesture("SHRINE");

    }

}


/* =====================================================
   TRIGGER GESTURE
===================================================== */

function triggerGesture(type){

    gestureCooldown=true;


    if(type==="RED"){

        redTechnique();

    }

    if(type==="VOID"){

        unlimitedVoid();

    }

    if(type==="SHRINE"){

        malevolentShrine();

    }


    setTimeout(()=>{

        gestureCooldown=false;

    },3500);

}


/* =====================================================
   INITIALIZE MEDIAPIPE HANDS
===================================================== */

const hands = new Hands({

    locateFile: (file)=>{

        return
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:.7,

    minTrackingConfidence:.7

});


hands.onResults(onResults);


/* =====================================================
   START CAMERA
===================================================== */

navigator.mediaDevices
.getUserMedia({

    video:{
        width:640,
        height:480,
        facingMode:"user"
    },

    audio:false

})

.then(stream=>{

    video.srcObject=stream;

    video.play();

    document
    .getElementById("status")
    .innerText="CAMERA READY";


    const camera=
    new Camera(video,{

        onFrame:async()=>{

            await hands.send({
                image:video
            });

        },

        width:640,

        height:480

    });


    camera.start();

})

.catch(err=>{

    console.error(err);

    document
    .getElementById("status")
    .innerText="CAMERA ACCESS DENIED";

});


</script>
