<style>

/* ===============================
   RESET
================================ */

*{
    margin:0;
    padding:0;

}

body{
    background:#020406;

/* ===============================
   MAIN APP
================================ */

#app{

    width:100vw;
    height:100vh;

    position:relative;

    background:
    radial-gradient(
        circle at center,
        #071018 0%,
        #020406 55%,

    );

}

/* ===============================
   CANVAS
================================ */

#effectCanvas{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* ===============================
   BACKGROUND GRID
================================ */

.grid{

    position:absolute;

    width:100%;
    height:100%;

    opacity:.18;

    background-image:

    linear-gradient(
        rgba(0,180,255,.08) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,180,255,.08) 1px,
        transparent 1px

    background-size:
    70px 70px;

    z-index:0;

================================ */

header{

    position:absolute;

    top:35px;

    width:100%;

    z-index:5;

header h1{

    font-size:28px;

    letter-spacing:10px;

    0 0 10px #00c8ff,

}

header p{

    margin-top:10px;

    font-size:9px;

    letter-spacing:6px;

    color:#65cfff;
}

   CAMERA BOX
================================ */

.camera-box{

    position:absolute;

    bottom:30px;
    left:30px;

    width:270px;
    height:190px;

    border:

    1px solid
    rgba(0,220,255,.55);

    border-radius:18px;

    overflow:hidden;

    z-index:6;

    box-shadow:

    0 0 20px rgba(0,200,255,.2),
    inset 0 0 30px rgba(0,200,255,.08);

    background:#020406;
}

#inputVideo{

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:.82;
}

.camera-overlay{

    position:absolute;

    bottom:0;

    width:100%;

    padding:10px;

    text-align:center;

    background:

    linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );

    font-size:12px;

    letter-spacing:3px;

    color:#bcecff;
}

/* ===============================
   STATUS
================================ */

.status{

    position:absolute;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    font-size:14px;

    letter-spacing:5px;

    color:#9cc7dc;

    z-index:5;
}

/* ===============================
   TECHNIQUE DISPLAY
================================ */

.technique-name{

    position:absolute;

    top:50%;

    left:50%;

    transform:
    translate(-50%,-50%);

    font-size:42px;

    letter-spacing:10px;

    font-weight:bold;

    opacity:0;

    z-index:7;

    text-align:center;

    pointer-events:none;

    transition:.3s;
}

.technique-name.show{

    opacity:1;

    animation:
    techniqueAnimation
    2s ease forwards;
}

@keyframes techniqueAnimation{

    0%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.6);

        filter:blur(20px);
    }

    30%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1.1);

        filter:blur(0);
    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(1.5);

        filter:blur(10px);
    }

}

/* ===============================
   CORNERS
================================ */

.corner{

    position:absolute;

    width:50px;
    height:50px;

    border-color:#00c8ff;

    opacity:.4;

    z-index:4;
}

.tl{

    top:20px;
    left:20px;

    border-top:2px solid;
    border-left:2px solid;
}

.tr{

    top:20px;
    right:20px;

    border-top:2px solid;
    border-right:2px solid;
}

.bl{

    bottom:20px;
    right:20px;

    border-bottom:2px solid;
    border-right:2px solid;
}

/* ===============================
   INSTRUCTIONS
================================ */

.controls{

    position:absolute;

    right:25px;
    bottom:30px;

    width:260px;

    padding:15px;

    border:

    1px solid
    rgba(255,255,255,.1);

    background:
    rgba(0,0,0,.4);

    backdrop-filter:
    blur(10px);

    z-index:5;

    font-size:10px;

    line-height:1.8;

    color:#8095a0;
}

.controls b{

    color:#fff;
}

/* ===============================
   MOBILE
================================ */

@media(max-width:700px){

    header h1{

        font-size:18px;

        letter-spacing:5px;
    }

    .camera-box{

        width:180px;
        height:130px;

        left:15px;
        bottom:15px;
    }

    .controls{

        display:none;
    }

    .technique-name{

        font-size:25px;

        letter-spacing:5px;
    }

}

<script>

/* ==========================================
   CANVAS SETUP
========================================== */

const canvas =
document.getElementById("effectCanvas");

const ctx =
canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* ==========================================
   DOM
========================================== */

const video =
document.getElementById("inputVideo");

const statusText =
document.getElementById("status");

const techniqueName =
document.getElementById("techniqueName");


/* ==========================================
   PARTICLE SYSTEM
========================================== */

let particles = [];

let currentEffect =
"none";

let effectTimer = 0;


/* ==========================================
   PARTICLE CLASS
========================================== */

class Particle{

    constructor(
        x,
        y,
        color,
        speed = 1,
        size = 2
    ){

        this.x = x;
        this.y = y;

        this.vx =
        (Math.random()-.5)
        * speed;

        this.vy =
        (Math.random()-.5)
        * speed;

        this.size =
        Math.random()*size+1;

        this.color = color;

        this.life = 1;

        this.decay =
        Math.random()*.01
        + .003;
    }


    update(){

        this.x += this.vx;

        this.y += this.vy;

        this.life -=
        this.decay;
    }


    draw(){

        ctx.save();

        ctx.globalAlpha =
        Math.max(this.life,0);

        ctx.fillStyle =
        this.color;

        ctx.shadowBlur =
        12;

        ctx.shadowColor =
        this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }

}


/* ==========================================
   PARTICLE UPDATE
========================================== */

function updateParticles(){

    for(
        let i =
        particles.length-1;

        i >= 0;

        i--
    ){

        const p =
        particles[i];

        p.update();

        p.draw();

        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}


/* ==========================================
   SHOW TECHNIQUE TEXT
========================================== */

function showTechnique(
text,
color
){

    techniqueName.innerText =
    text;

    techniqueName.style.color =
    color;

    techniqueName.style.textShadow =

    `0 0 15px ${color},
     0 0 40px ${color},
     0 0 80px ${color}`;

    techniqueName.classList.remove(
    "show"
    );

    void techniqueName.offsetWidth;

    techniqueName.classList.add(
    "show"
    );

}


/* ==========================================
   SCREEN SHAKE
========================================== */

function screenShake(){

    const app =
    document.getElementById("app");

    let count = 0;

    const shake =
    setInterval(()=>{

        const x =
        (Math.random()-.5)*12;

        const y =
        (Math.random()-.5)*12;

        app.style.transform =
        `translate(${x}px,${y}px)`;

        count++;

        if(count > 15){

            clearInterval(shake);

            app.style.transform =
            "translate(0,0)";
        }

    },30);

}


/* ==========================================
   RED TECHNIQUE
========================================== */

function gojoRed(){

    currentEffect =
    "red";

    effectTimer = 0;

    showTechnique(
    "術 式 反 転 ・赫",
    "#ff1a35"
    );

    statusText.innerText =
    "GOJO RED TECHNIQUE ACTIVATED";

    screenShake();

}


/* ==========================================
   BLUE TECHNIQUE
========================================== */

function gojoBlue(){

    currentEffect =
    "blue";

    effectTimer = 0;

    showTechnique(
    "術 式 順 転 ・蒼",
    "#00aaff"
    );

    statusText.innerText =
    "GOJO BLUE TECHNIQUE ACTIVATED";

}


/* ==========================================
   HOLLOW PURPLE
========================================== */

function hollowPurple(){

    currentEffect =
    "purple";

    effectTimer = 0;

    showTechnique(
    "虚 式 ・茈",
    "#a020ff"
    );

    statusText.innerText =
    "HOLLOW PURPLE ACTIVATED";

    screenShake();

}


/* ==========================================
   UNLIMITED VOID
========================================== */

function unlimitedVoid(){

    currentEffect =
    "void";

    effectTimer = 0;

    showTechnique(
    "無 量 空 処",
    "#dffcff"
    );

    statusText.innerText =
    "DOMAIN EXPANSION: UNLIMITED VOID";

}


/* ==========================================
   SUKUNA AURA
========================================== */

function sukunaAura(){

    currentEffect =
    "sukuna";

    effectTimer = 0;

    showTechnique(
    "呪 い の 王",
    "#ff0000"
    );

    statusText.innerText =
    "RYOMEN SUKUNA DETECTED";

}


/* ==========================================
   MALEVOLENT SHRINE
========================================== */

function shrine(){

    currentEffect =
    "shrine";

    effectTimer = 0;

    showTechnique(
    "伏 魔 御 厨 子",
    "#ff0000"
    );

    statusText.innerText =
    "DOMAIN EXPANSION: MALEVOLENT SHRINE";

    screenShake();

}


/* ==========================================
   CLEAR EFFECT
========================================== */

function clearEffect(){

    currentEffect =
    "none";

    particles = [];

    statusText.innerText =
    "SYSTEM READY";

}


/* ==========================================
   RED PARTICLE EFFECT
========================================== */

function drawRed(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    /* ENERGY CORE */

    const gradient =
    ctx.createRadialGradient(

        cx,
        cy,
        10,

        cx,
        cy,
        180
    );

    gradient.addColorStop(
    0,
    "rgba(255,255,255,.95)"
    );

    gradient.addColorStop(
    .15,
    "rgba(255,60,40,.9)"
    );

    gradient.addColorStop(
    .5,
    "rgba(255,0,30,.25)"
    );

    gradient.addColorStop(
    1,
    "transparent"
    );

    ctx.fillStyle =
    gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        180,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* PARTICLES */

    for(let i=0;i<35;i++){

        const angle =
        Math.random()*Math.PI*2;

        const radius =
        Math.random()*250;

        particles.push(

            new Particle(

                cx +
                Math.cos(angle)*radius,

                cy +
                Math.sin(angle)*radius,

                "#ff1730",

                8,

                2

            )

        );

    }

}


/* ==========================================
   BLUE PARTICLE EFFECT
========================================== */

function drawBlue(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    for(let i=0;i<25;i++){

        const angle =
        Math.random()*Math.PI*2;

        const radius =
        250;

        particles.push(

            new Particle(

                cx +
                Math.cos(angle)*radius,

                cy +
                Math.sin(angle)*radius,

                "#00aaff",

                3,

                2

            )

        );

    }


    particles.forEach(p=>{

        p.vx +=
        (cx-p.x)*.002;

        p.vy +=
        (cy-p.y)*.002;

    });


    ctx.beginPath();

    ctx.strokeStyle =
    "rgba(0,180,255,.7)";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 30;

    ctx.shadowColor =
    "#00aaff";

    ctx.arc(
        cx,
        cy,
        100,
        0,
        Math.PI*2
    );

    ctx.stroke();

}


/* ==========================================
   HOLLOW PURPLE
========================================== */

function drawPurple(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    for(let i=0;i<40;i++){

        const angle =
        Math.random()*Math.PI*2;

        const radius =
        Math.random()*180;

        const color =
        Math.random()>.5
        ? "#ff1744"
        : "#7c00ff";


        particles.push(

            new Particle(

                cx +
                Math.cos(angle)*radius,

                cy +
                Math.sin(angle)*radius,

                color,

                7,

                3

            )

        );

    }


    const gradient =
    ctx.createRadialGradient(

        cx,
        cy,
        0,

        cx,
        cy,
        220
    );

    gradient.addColorStop(
    0,
    "#ffffff"
    );

    gradient.addColorStop(
    .15,
    "#ff00ff"
    );

    gradient.addColorStop(
    .4,
    "#6200ff"
    );

    gradient.addColorStop(
    1,
    "transparent"
    );


    ctx.fillStyle =
    gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        220,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* ==========================================
   UNLIMITED VOID
========================================== */

function drawVoid(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    /* STAR PARTICLES */

    for(let i=0;i<18;i++){

        particles.push(

            new Particle(

                Math.random()*canvas.width,

                Math.random()*canvas.height,

                Math.random()>.7
                ? "#53d9ff"
                : "#ffffff",

                .4,

                2

            )

        );

    }


    /* INFINITY PORTAL */

    const time =
    Date.now()*.001;


    for(let ring=0;ring<5;ring++){

        const radius =
        90 + ring*35 +
        Math.sin(time+ring)*10;


        ctx.beginPath();

        ctx.strokeStyle =

        `rgba(
        220,
        245,
        255,
        ${.8-ring*.12}
        )`;

        ctx.lineWidth =
        2;

        ctx.shadowBlur =
        25;

        ctx.shadowColor =
        "#ffffff";


        ctx.arc(

            cx,
            cy,

            radius,

            0,
            Math.PI*2

        );

        ctx.stroke();

    }


    /* BLACK VOID CENTER */

    const gradient =
    ctx.createRadialGradient(

        cx,
        cy,
        10,

        cx,
        cy,
        130
    );

    gradient.addColorStop(
    0,
    "#000"
    );

    gradient.addColorStop(
    .7,
    "rgba(0,0,0,.8)"
    );

    gradient.addColorStop(
    1,
    "transparent"
    );


    ctx.fillStyle =
    gradient;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        140,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* ==========================================
   SUKUNA CURSED AURA
========================================== */

function drawSukuna(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    /* RED CURSED PARTICLES */

    for(let i=0;i<30;i++){

        const angle =
        Math.random()*Math.PI*2;

        const radius =
        150 + Math.random()*250;


        particles.push(

            new Particle(

                cx +
                Math.cos(angle)*radius,

                cy +
                Math.sin(angle)*radius,

                Math.random()>.5
                ? "#ff0019"
                : "#990000",

                4,

                2

            )

        );

    }


    /* CURSED RINGS */

    const time =
    Date.now()*.002;


    for(let i=0;i<3;i++){

        ctx.save();

        ctx.translate(cx,cy);

        ctx.rotate(
        time*(i+1)
        );

        ctx.scale(
        1,
        .55
        );

        ctx.beginPath();

        ctx.strokeStyle =
        `rgba(255,0,25,${.7-i*.15})`;

        ctx.lineWidth = 2;

        ctx.shadowBlur = 25;

        ctx.shadowColor =
        "#ff0000";

        ctx.arc(
            0,
            0,
            150+i*60,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }

}


/* ==========================================
   MALEVOLENT SHRINE
========================================== */

function drawShrine(){

    const cx =
    canvas.width/2;

    const cy =
    canvas.height/2;


    /* RED GROUND PARTICLES */

    for(let i=0;i<25;i++){

        const x =
        Math.random()*canvas.width;

        const y =
        canvas.height*.7 +
        Math.random()*200;


        particles.push(

            new Particle(

                x,

                y,

                "#ff0015",

                2,

                2

            )

        );

    }


    /* SHRINE PARTICLE ROOF */

    for(let i=0;i<15;i++){

        const x =
        cx-250+
        Math.random()*500;

        const y =
        cy-180+
        Math.random()*60;


        particles.push(

            new Particle(

                x,

                y,

                "#ff1a1a",

                1,

                2

            )

        );

    }


    /* PARTICLE SHRINE SHAPE */

    ctx.save();

    ctx.strokeStyle =
    "rgba(255,0,20,.7)";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 30;

    ctx.shadowColor =
    "#ff0000";


    /* LEFT */

    ctx.beginPath();

    ctx.moveTo(
        cx-150,
        cy+200
    );

    ctx.lineTo(
        cx-100,
        cy-150
    );

    ctx.stroke();


    /* RIGHT */

    ctx.beginPath();

    ctx.moveTo(
        cx+150,
        cy+200
    );

    ctx.lineTo(
        cx+100,
        cy-150
    );

    ctx.stroke();


    /* ROOF */

    ctx.beginPath();

    ctx.moveTo(
        cx-220,
        cy-150
    );

    ctx.lineTo(
        cx,
        cy-260
    );

    ctx.lineTo(
        cx+220,
        cy-150
    );

    ctx.stroke();


    ctx.restore();

}


/* ==========================================
   MAIN ANIMATION LOOP
========================================== */

function animate(){

    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    effectTimer++;


    if(currentEffect === "red"){

        drawRed();

    }


    if(currentEffect === "blue"){

        drawBlue();

    }


    if(currentEffect === "purple"){

        drawPurple();

    }


    if(currentEffect === "void"){

        drawVoid();

    }


    if(currentEffect === "sukuna"){

        drawSukuna();

    }


    if(currentEffect === "shrine"){

        drawShrine();

    }


    updateParticles();


    /* LIMIT PARTICLES */

    if(particles.length > 1800){

        particles.splice(
        0,
        particles.length-1800
        );

    }


    requestAnimationFrame(
    animate
    );

}

animate();


/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener(
"keydown",
(e)=>{

    if(e.key === "1"){
        gojoRed();
    }

    if(e.key === "2"){
        gojoBlue();
    }

    if(e.key === "3"){
        hollowPurple();
    }

    if(e.key === "4"){
        unlimitedVoid();
    }

    if(e.key === "5"){
        sukunaAura();
    }

    if(e.key === "6"){
        shrine();
    }

    if(e.code === "Space"){

        clearEffect();

    }

});


/* ==========================================
   MEDIAPIPE HANDS
========================================== */

let lastGestureTime = 0;


const hands =
new Hands({

    locateFile:
    (file)=>{

        return
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.7,

    minTrackingConfidence:.7

});


hands.onResults(
onHandResults
);


/* ==========================================
   HAND RESULT
========================================== */

function onHandResults(results){

    if(!results.multiHandLandmarks)
    return;


    const now =
    Date.now();


    if(
        now-lastGestureTime
        < 2500
    ){
        return;
    }


    const handsDetected =
    results.multiHandLandmarks;


    /* =========================
       TWO HANDS = UNLIMITED VOID
    ========================= */

    if(
        handsDetected.length === 2
    ){

        const h1 =
        handsDetected[0];

        const h2 =
        handsDetected[1];


        const index1 =
        h1[8];

        const index2 =
        h2[8];


        const distance =
        Math.abs(
            index1.x-index2.x
        );


        if(distance < .25){

            unlimitedVoid();

            lastGestureTime =
            now;

            return;
        }

    }


    /* =========================
       SINGLE HAND GESTURES
    ========================= */

    if(
        handsDetected.length === 1
    ){

        const hand =
        handsDetected[0];


        const wrist =
        hand[0];

        const indexTip =
        hand[8];

        const middleTip =
        hand[12];

        const ringTip =
        hand[16];

        const pinkyTip =
        hand[20];


        /* INDEX POINTING */

        const pointing =

        indexTip.y < hand[6].y

        &&

        middleTip.y >
        hand[10].y

        &&

        ringTip.y >
        hand[14].y;


        /* OPEN HAND */

        const openHand =

        indexTip.y < wrist.y

        &&

        middleTip.y < wrist.y

        &&

        ringTip.y < wrist.y

        &&

        pinkyTip.y < wrist.y;


        if(pointing){

            gojoRed();

            lastGestureTime =
            now;

        }


        else if(openHand){

            sukunaAura();

            lastGestureTime =
            now;

        }

    }

}


/* ==========================================
   MEDIAPIPE POSE
========================================== */

const pose =
new Pose({

    locateFile:
    (file)=>{

        return
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.6,

    minTrackingConfidence:.6

});


pose.onResults(
(results)=>{

    if(!results.poseLandmarks)
    return;


    /* Pose system ready */

});


/* ==========================================
   CAMERA
========================================== */

const camera =
new Camera(

video,

{

    onFrame:
    async()=>{

        await hands.send({

            image:video

        });

        await pose.send({

            image:video

        });

    },


    width:640,

    height:480

}

);


camera.start();


/* ==========================================
   START STATUS
========================================== */

setTimeout(()=>{

    statusText.innerText =
    "CAMERA ONLINE";

},1500);


setTimeout(()=>{

    statusText.innerText =
    "GESTURE SYSTEM ACTIVE";

},3000);


setTimeout(()=>{

    statusText.innerText =
    "SYSTEM READY";

},5000);


</script>
