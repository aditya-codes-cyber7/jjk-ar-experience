<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JJK AR EXPERIENCE</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
</head>


<body>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="background"></div>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>呪 術 廻 戦</h1>

        <p>CURSED TECHNIQUE EXPERIENCE</p>

    </header>


    <!-- =========================
         MAIN EFFECT CANVAS
    ========================== -->

    <canvas id="effectCanvas"></canvas>


    <!-- =========================
         SCREEN FLASH
    ========================== -->

    <div id="flash"></div>


    <!-- =========================
         TECHNIQUE NAME DISPLAY
    ========================== -->

    <div
        class="technique-name"
        id="techniqueName"
    >

        <h2 id="techniqueTitle">
            TECHNIQUE
        </h2>

        <p id="techniqueSub">
            CURSED ENERGY
        </p>

    </div>


    <!-- =========================
         CAMERA BOX
    ========================== -->

    <div class="camera-box">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>


        <!-- Hand Skeleton Canvas -->

        <canvas id="handCanvas"></canvas>


        <!-- Camera Label -->

        <div class="camera-label">

            AR POSE DETECTION

        </div>

    </div>


    <!-- =========================
         STATUS TEXT
    ========================== -->

    <div
        class="status"
        id="status"
    >

        SYSTEM INITIALIZING

    </div>


    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls">

        <b>TECHNIQUE CONTROLS</b>

        <br>

        1 → RED

        <br>

        2 → UNLIMITED VOID

        <br>

        3 → MALEVOLENT SHRINE

        <br>

        SPACE → CLEAR

        <br>

        <span class="gesture-help">
            🤏 PINCH → RED
            <br>
            🖐 OPEN PALM → VOID
            <br>
            ✌ TWO FINGERS → SHRINE
        </span>

    </div>


    <!-- =========================
         MEDIAPIPE LIBRARIES
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
