<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR Experience</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

video,canvas{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

video{
  transform:scaleX(-1);
  filter:brightness(.65) contrast(1.15);
}

#handCanvas{
  transform:scaleX(-1);
  z-index:5;
}

#fxCanvas{
  z-index:10;
  pointer-events:none;
}

#darkness{
  position:absolute;
  inset:0;
  z-index:8;
  pointer-events:none;
  background:
    radial-gradient(circle at center,
    rgba(50,0,100,.15),
    rgba(0,0,0,.85));
  opacity:0;
  transition:opacity .8s;
}

#darkness.active{opacity:1}

/* UI */

#ui{
  position:absolute;
  z-index:30;
  top:25px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

h1{
  font-size:26px;
  letter-spacing:6px;
  text-shadow:0 0 20px #9b5cff;
}

#status{
  margin-top:10px;
  font-size:12px;
  letter-spacing:3px;
  color:#d8c4ff;
}

/* Start */

#startBtn{
  position:absolute;
  z-index:50;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:18px 30px;
  border:1px solid #9b5cff;
  background:rgba(15,0,35,.92);
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  letter-spacing:3px;
  box-shadow:0 0 30px #7c3aed;
}

/* Text */

#domainText{
  position:absolute;
  z-index:40;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.5);
  text-align:center;
  opacity:0;
  pointer-events:none;
}

#domainText.active{
  animation:reveal 2s forwards;
}

.japanese{
  font-size:clamp(55px,10vw,130px);
  text-shadow:
    0 0 20px #b56cff,
    0 0 60px #7c3aed,
    0 0 120px #3b0764;
}

.domain{
  margin-top:15px;
  letter-spacing:10px;
  font-size:18px;
  color:#e9d5ff;
}

@keyframes reveal{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
    filter:blur(25px);
  }
  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* Flash */

#flash{
  position:absolute;
  inset:0;
  z-index:45;
  background:#d8b4fe;
  opacity:0;
  pointer-events:none;
}

#flash.active{
  animation:flash .7s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  15%{opacity:.9}
  100%{opacity:0}
}

/* Corners */

.corner{
  position:absolute;
  width:60px;
  height:60px;
  z-index:35;
  opacity:.7;
  border-color:#9b5cff;
}

.tl{top:20px;left:20px;border-top:2px solid;border-left:2px solid}
.tr{top:20px;right:20px;border-top:2px solid;border-right:2px solid}
.bl{bottom:20px;left:20px;border-bottom:2px solid;border-left:2px solid}
.br{bottom:20px;right:20px;border-bottom:2px solid;border-right:2px solid}

</style>
</head>

<body>

<div id="app">

<video id="webcam" autoplay playsinline></video>

<canvas id="handCanvas"></canvas>

<div id="darkness"></div>

<canvas id="fxCanvas"></canvas>

<div id="domainText">
  <div class="japanese">無量空処</div>
  <div class="domain">UNLIMITED VOID</div>
</div>

<div id="flash"></div>

<div id="ui">
  <h1>JJK AR EXPERIENCE</h1>
  <div id="status">SYSTEM READY</div>
</div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<button id="startBtn">ACTIVATE CURSED ENERGY</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

/* ELEMENTS */

const video = document.getElementById("webcam");

const handCanvas = document.getElementById("handCanvas");
const handCtx = handCanvas.getContext("2d");

const fxCanvas = document.getElementById("fxCanvas");
const fx = fxCanvas.getContext("2d");

const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

const darkness = document.getElementById("darkness");
const flash = document.getElementById("flash");
const domainText = document.getElementById("domainText");

let active = false;
let fxRunning = false;
let animationId = null;


/* CANVAS */

function resize(){

  handCanvas.width = innerWidth;
  handCanvas.height = innerHeight;

  fxCanvas.width = innerWidth;
  fxCanvas.height = innerHeight;

}

addEventListener("resize",resize);
resize();


/* ENERGY PARTICLES */

class EnergyParticle{

  constructor(x,y,color,type="normal"){

    this.x=x;
    this.y=y;

    this.color=color;
    this.type=type;

    this.angle=Math.random()*Math.PI*2;
    this.speed=1+Math.random()*4;

    this.life=1;

    this.size=2+Math.random()*5;

  }

  update(){

    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    this.speed*=.98;
    this.life-=.012;

  }

  draw(){

    fx.beginPath();

    fx.arc(this.x,this.y,this.size,0,Math.PI*2);

    fx.fillStyle=this.color;

    fx.globalAlpha=Math.max(0,this.life);

    fx.shadowBlur=25;
    fx.shadowColor=this.color;

    fx.fill();

    fx.globalAlpha=1;

  }

}


/* EFFECT OBJECTS */

let blueParticles=[];
let redParticles=[];
let stars=[];


/* CREATE STARS */

function createStars(){

  stars=[];

  for(let i=0;i<500;i++){

    stars.push({

      x:Math.random()*fxCanvas.width,
      y:Math.random()*fxCanvas.height,

      z:Math.random()*3+1,

      size:Math.random()*2

    });

  }

}


/* DRAW STARS */

function drawVoid(){

  for(const s of stars){

    s.z+=.03;

    if(s.z>4){

      s.z=.5;
      s.x=Math.random()*fxCanvas.width;
      s.y=Math.random()*fxCanvas.height;

    }

    const size=s.size*s.z;

    fx.beginPath();

    fx.arc(s.x,s.y,size,0,Math.PI*2);

    fx.fillStyle="rgba(210,170,255,.8)";

    fx.shadowBlur=10;
    fx.shadowColor="#8b5cf6";

    fx.fill();

  }

}


/* ENERGY ORB */

function drawOrb(x,y,r,color,time){

  const gradient=fx.createRadialGradient(
    x,y,0,
    x,y,r
  );

  gradient.addColorStop(0,"#fff");
  gradient.addColorStop(.15,color);
  gradient.addColorStop(.5,color+"99");
  gradient.addColorStop(1,"transparent");

  fx.fillStyle=gradient;

  fx.beginPath();
  fx.arc(x,y,r,0,Math.PI*2);
  fx.fill();


  /* rotating rings */

  fx.strokeStyle=color;
  fx.lineWidth=2;
  fx.globalAlpha=.8;

  for(let i=0;i<3;i++){

    fx.beginPath();

    fx.ellipse(
      x,
      y,
      r*(1.5+i*.25),
      r*(.5+i*.1),
      time*.002+i,
      0,
      Math.PI*2
    );

    fx.stroke();

  }

  fx.globalAlpha=1;

}


/* SHOCKWAVE */

function shockwave(x,y,r,color){

  fx.beginPath();

  fx.arc(x,y,r,0,Math.PI*2);

  fx.strokeStyle=color;

  fx.lineWidth=4;

  fx.globalAlpha=Math.max(0,1-r/900);

  fx.shadowBlur=30;
  fx.shadowColor=color;

  fx.stroke();

  fx.globalAlpha=1;

}


/* MAIN ANIMATION */

let startTime=0;

function animate(time){

  if(!fxRunning)return;

  const elapsed=time-startTime;

  fx.clearRect(
    0,
    0,
    fxCanvas.width,
    fxCanvas.height
  );


  /* STAGE 1 */

  if(elapsed<3000){

    const blueX=fxCanvas.width*.30;
    const redX=fxCanvas.width*.70;

    const y=fxCanvas.height*.5;

    drawOrb(
      blueX,
      y,
      80+Math.sin(time*.01)*15,
      "#2563ff",
      time
    );

    drawOrb(
      redX,
      y,
      80+Math.sin(time*.012)*15,
      "#ff1744",
      time
    );


    for(let i=0;i<6;i++){

      const a=time*.003+i;

      fx.beginPath();

      fx.moveTo(
        blueX,
        y
      );

      fx.lineTo(
        blueX+
        Math.cos(a)*200,
        y+
        Math.sin(a)*200
      );

      fx.strokeStyle="#3b82ff";
      fx.lineWidth=2;
      fx.shadowBlur=20;
      fx.shadowColor="#2563ff";
      fx.stroke();

    }

    for(let i=0;i<6;i++){

      const a=-time*.003+i;

      fx.beginPath();

      fx.moveTo(
        redX,
        y
      );

      fx.lineTo(
        redX+
        Math.cos(a)*200,
        y+
        Math.sin(a)*200
      );

      fx.strokeStyle="#ff1744";
      fx.lineWidth=2;
      fx.shadowBlur=20;
      fx.shadowColor="#ff1744";
      fx.stroke();

    }

  }


  /* STAGE 2 COLLISION */

  else if(elapsed<5000){

    const progress=(elapsed-3000)/2000;

    const blueX=
      fxCanvas.width*.30+
      fxCanvas.width*.20*progress;

    const redX=
      fxCanvas.width*.70-
      fxCanvas.width*.20*progress;

    const y=fxCanvas.height*.5;

    drawOrb(
      blueX,y,
      90,
      "#2563ff",
      time
    );

    drawOrb(
      redX,y,
      90,
      "#ff1744",
      time
    );


    if(progress>.7){

      const center=fxCanvas.width/2;

      drawOrb(
        center,
        y,
        100+progress*150,
        "#a855f7",
        time
      );

    }

  }


  /* STAGE 3 EXPLOSION */

  else if(elapsed<6000){

    const centerX=fxCanvas.width/2;
    const centerY=fxCanvas.height/2;

    const progress=(elapsed-5000)/1000;

    shockwave(
      centerX,
      centerY,
      progress*1500,
      "#a855f7"
    );

    drawOrb(
      centerX,
      centerY,
      250+progress*500,
      "#a855f7",
      time
    );

  }


  /* STAGE 4 VOID */

  else{

    drawVoid();

    const cx=fxCanvas.width/2;
    const cy=fxCanvas.height/2;

    /* cosmic rings */

    for(let i=0;i<5;i++){

      fx.beginPath();

      fx.ellipse(
        cx,
        cy,
        150+i*90,
        70+i*45,
        time*.0005+i,
        0,
        Math.PI*2
      );

      fx.strokeStyle=
        "rgba(170,100,255,.25)";

      fx.lineWidth=2;

      fx.stroke();

    }

  }


  animationId=requestAnimationFrame(animate);

}


/* START EFFECT */

function activateGojo(){

  if(active)return;

  active=true;

  handCanvas.style.opacity="0";

  status.innerText=
    "CURSED ENERGY: BLUE + RED";

  darkness.classList.add("active");

  createStars();

  fxRunning=true;

  startTime=performance.now();

  animationId=
    requestAnimationFrame(animate);


  setTimeout(()=>{

    status.innerText=
      "DOMAIN EXPANSION";

    flash.classList.add("active");

  },5000);


  setTimeout(()=>{

    domainText.classList.add("active");

  },6200);


  /* RESET */

  setTimeout(()=>{

    fxRunning=false;

    cancelAnimationFrame(animationId);

    fx.clearRect(
      0,0,
      fxCanvas.width,
      fxCanvas.height
    );

    darkness.classList.remove("active");

    domainText.classList.remove("active");

    handCanvas.style.opacity="1";

    status.innerText=
      "SHOW GOJO HAND SIGN";

    active=false;

  },14000);

}


/* GOJO GESTURE */

function isGojoPose(hand){

  const indexUp=
    hand[8].y<hand[6].y;

  const middleUp=
    hand[12].y<hand[10].y;

  const ringDown=
    hand[16].y>hand[14].y;

  const pinkyDown=
    hand[20].y>hand[18].y;

  return(
    indexUp &&
    middleUp &&
    ringDown &&
    pinkyDown
  );

}


/* MEDIAPIPE */

const hands=new Hands({

  locateFile:(file)=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.7,

  minTrackingConfidence:.7

});


hands.onResults(results=>{

  handCtx.clearRect(
    0,0,
    handCanvas.width,
    handCanvas.height
  );


  if(!results.multiHandLandmarks)return;

  let detected=false;


  results.multiHandLandmarks.forEach(hand=>{

    if(!active){

      drawConnectors(
        handCtx,
        hand,
        HAND_CONNECTIONS,
        {
          color:"#9d4edd",
          lineWidth:4
        }
      );

      drawLandmarks(
        handCtx,
        hand,
        {
          color:"#fff",
          radius:5
        }
      );

    }


    if(isGojoPose(hand)){

      detected=true;

    }

  });


  if(detected&&!active){

    activateGojo();

  }

  else if(!active){

    status.innerText=
      "SHOW GOJO HAND SIGN";

  }

});


/* CAMERA */

startBtn.addEventListener(
  "click",
  async()=>{

    try{

      status.innerText=
        "ACTIVATING CAMERA...";


      const stream=
        await navigator.mediaDevices
        .getUserMedia({

          video:true,
          audio:false

        });


      video.srcObject=stream;

      await video.play();

      startBtn.style.display="none";


      const camera=
        new Camera(video,{

          onFrame:async()=>{

            await hands.send({
              image:video
            });

          },

          width:1280,
          height:720

        });


      camera.start();

      status.innerText=
        "SHOW GOJO HAND SIGN";

    }

    catch(err){

      console.error(err);

      status.innerText=
        "CAMERA ACCESS DENIED";

    }

  }
);

</script>

</body>
</html>
