<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJK AR Experience</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#010204;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

/* MAIN CANVAS */

#fxCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* DARK CINEMATIC OVERLAY */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;

    background:
    radial-gradient(circle at center,
    transparent 20%,
    rgba(0,0,0,.25) 70%,
    rgba(0,0,0,.75) 100%);
}


/* TITLE */

#title{
    position:fixed;
    top:42px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:10;
}

#title h1{
    font-size:27px;
    letter-spacing:7px;
    color:#e7f6ff;

    text-shadow:
    0 0 15px rgba(150,220,255,.5);
}

#title p{
    margin-top:9px;

    font-size:8px;
    letter-spacing:5px;

    color:#73dfff;
}


/* CAMERA */

#cameraBox{
    position:fixed;

    left:25px;
    bottom:28px;

    width:280px;
    height:205px;

    border-radius:17px;

    overflow:hidden;

    z-index:20;

    background:#000;

    border:1px solid rgba(80,220,255,.45);

    box-shadow:
    0 0 30px rgba(0,200,255,.18),
    inset 0 0 30px rgba(0,0,0,.8);
}

#video{
    position:absolute;
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:.82;
}

#handCanvas{
    position:absolute;
    width:100%;
    height:100%;

    transform:scaleX(-1);

    z-index:3;
}

#cameraLabel{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;

    padding:9px;

    text-align:center;

    background:
    linear-gradient(
    transparent,
    rgba(0,0,0,.9)
    );

    font-size:10px;

    letter-spacing:3px;

    color:#9deaff;

    z-index:5;
}


/* STATUS */

#status{

    position:fixed;

    bottom:38px;

    left:50%;

    transform:translateX(-50%);

    z-index:20;

    font-size:11px;

    letter-spacing:4px;

    color:#9bdff5;

    text-shadow:
    0 0 15px #00cfff;
}


/* TECHNIQUE NAME */

#technique{

    position:fixed;

    top:150px;

    left:50%;

    transform:translateX(-50%);

    z-index:30;

    text-align:center;

    opacity:0;

    transition:.4s;

    pointer-events:none;
}

#technique.active{
    opacity:1;
}

#technique h2{

    font-size:25px;

    letter-spacing:8px;

    text-shadow:
    0 0 20px currentColor;
}

#technique p{

    margin-top:8px;

    font-size:9px;

    letter-spacing:4px;
}


/* HELP */

#help{

    position:fixed;

    right:25px;
    bottom:28px;

    z-index:20;

    text-align:right;

    color:rgba(255,255,255,.4);

    font-size:10px;

    line-height:1.8;

    letter-spacing:1px;
}

</style>
</head>

<body>


<canvas id="fxCanvas"></canvas>


<div id="title">

<h1>呪 術 廻 戦</h1>

<p>CURSED TECHNIQUE EXPERIENCE</p>

</div>


<div id="technique">

<h2 id="techniqueTitle"></h2>

<p id="techniqueSub"></p>

</div>


<div id="cameraBox">

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="handCanvas"></canvas>

<div id="cameraLabel">
AR HAND DETECTION
</div>

</div>


<div id="status">
INITIALIZING SYSTEM
</div>


<div id="help">

GOJO → TWO FINGERS<br>
SUKUNA → OPEN PALM<br>
FIST → RESET

</div>



<!-- MEDIAPIPE -->

<script type="module">

import {

FilesetResolver,
HandLandmarker

}

from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const handCanvas =
document.getElementById("handCanvas");

const handCtx =
handCanvas.getContext("2d");

const fxCanvas =
document.getElementById("fxCanvas");

const ctx =
fxCanvas.getContext("2d");

const status =
document.getElementById("status");

const technique =
document.getElementById("technique");

const techniqueTitle =
document.getElementById("techniqueTitle");

const techniqueSub =
document.getElementById("techniqueSub");


let W;
let H;


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    fxCanvas.width=W;
    fxCanvas.height=H;

}

resize();

window.addEventListener(
"resize",
resize
);


/* =====================================================
   WEBCAM
===================================================== */

async function startCamera(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({

video:{
width:{ideal:1280},
height:{ideal:720},
facingMode:"user"
},

audio:false

});

video.srcObject=stream;

video.onloadedmetadata=()=>{

handCanvas.width=
video.videoWidth;

handCanvas.height=
video.videoHeight;

status.innerText=
"CAMERA ONLINE";

};

}

catch(error){

status.innerText=
"CAMERA ACCESS DENIED";

console.error(error);

}

}

await startCamera();


/* =====================================================
   PARTICLES
===================================================== */

let particles=[];

let mode="idle";

let lastModeTime=0;


/* PARTICLE */

class Particle{

constructor(
x,
y,
color,
size
){

this.x=x;
this.y=y;

this.tx=x;
this.ty=y;

this.vx=0;
this.vy=0;

this.color=color;

this.size=size;

this.alpha=
Math.random()*.8+.2;

this.speed=
Math.random()*.04+.015;

this.angle=
Math.random()*Math.PI*2;

this.radius=0;

this.type="normal";

}


update(){

this.x+=
(this.tx-this.x)*
this.speed;

this.y+=
(this.ty-this.y)*
this.speed;

this.x+=this.vx;
this.y+=this.vy;

this.vx*=.96;
this.vy*=.96;

}


draw(){

ctx.beginPath();

ctx.fillStyle=
`rgba(${this.color},${this.alpha})`;

ctx.shadowBlur=
this.size*5;

ctx.shadowColor=
`rgb(${this.color})`;

ctx.arc(
this.x,
this.y,
this.size,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

}

}



/* =====================================================
   CLEAR
===================================================== */

function clearParticles(){

particles=[];

}



/* =====================================================
   SHOW TECHNIQUE
===================================================== */

function showTechnique(
title,
sub,
color
){

techniqueTitle.innerText=title;

techniqueSub.innerText=sub;

technique.style.color=color;

technique.classList.add("active");

setTimeout(()=>{

technique.classList.remove("active");

},3500);

}



/* =====================================================
   GOJO
   INFINITY VOID
===================================================== */

function activateInfinity(){

const now=Date.now();

if(mode==="infinity")
return;

if(now-lastModeTime<3000)
return;

lastModeTime=now;

clearParticles();

mode="infinity";

status.innerText=
"∞ INFINITY VOID";

showTechnique(

"INFINITY VOID",

"LIMITLESS • DOMAIN EXPANSION",

"#b7efff"

);


const cx=W/2;
const cy=H/2;


/* PORTAL RING */

for(let i=0;i<4500;i++){

const angle=
Math.random()*Math.PI*2;

const radius=
190+
(Math.random()-.5)*35;

const p=
new Particle(

cx+
(Math.random()-.5)*40,

cy+
(Math.random()-.5)*40,

Math.random()>.3
?
"230,250,255"
:
"70,200,255",

Math.random()*1.5+.25

);

p.angle=angle;

p.radius=radius;

p.type="infinityRing";

particles.push(p);

}


/* UNIVERSE PARTICLES */

for(let i=0;i<4000;i++){

const p=
new Particle(

cx,
cy,

Math.random()>.8
?
"50,190,255"
:
"210,240,255",

Math.random()*1.2+.2

);

p.tx=
Math.random()*W;

p.ty=
Math.random()*H;

p.type="space";

particles.push(p);

}

}



/* =====================================================
   SUKUNA
   RED TECHNIQUE
===================================================== */

function activateRed(){

const now=Date.now();

if(mode==="red")
return;

if(now-lastModeTime<3000)
return;

lastModeTime=now;

clearParticles();

mode="red";

status.innerText=
"🔴 CURSED TECHNIQUE ACTIVATED";

showTechnique(

"CURSED TECHNIQUE",

"DOMAIN EXPANSION",

"#ff3030"

);


const cx=W/2;
const cy=H/2;


/* CENTRAL RED ORB */

for(let i=0;i<3500;i++){

const angle=
Math.random()*Math.PI*2;

const radius=
Math.pow(
Math.random(),
2
)*125;

const p=
new Particle(

cx,
cy,

Math.random()>.3
?
"255,30,30"
:
"255,210,210",

Math.random()*1.6+.25

);

p.tx=
cx+
Math.cos(angle)*radius;

p.ty=
cy+
Math.sin(angle)*radius;

p.type="redCore";

particles.push(p);

}


/* PARTICLE RINGS */

for(let ring=0;
ring<6;
ring++){

const base=
130+ring*58;

for(let i=0;
i<700;
i++){

const angle=
Math.random()*Math.PI*2;

const p=
new Particle(

cx,
cy,

ring%2===0
?
"255,25,25"
:
"180,0,0",

Math.random()*1.3+.2

);

p.angle=angle;

p.radius=
base+
(Math.random()-.5)*15;

p.ringIndex=ring;

p.type="redRing";

particles.push(p);

}

}


/* RED EXPLOSION CLOUD */

for(let i=0;
i<2500;
i++){

const angle=
Math.random()*Math.PI*2;

const distance=
250+
Math.random()*500;

const p=
new Particle(

cx,
cy,

"255,30,60",

Math.random()*1.2+.2

);

p.tx=
cx+
Math.cos(angle)*distance;

p.ty=
cy+
Math.sin(angle)*distance;

p.type="explosion";

particles.push(p);

}

}



/* =====================================================
   SUKUNA DOMAIN PARTICLE STRUCTURE
===================================================== */

function createDomain(){

const cx=W/2;
const baseY=H*.72;


/* PARTICLE GROUND */

for(let i=0;i<3500;i++){

const p=
new Particle(

cx,
baseY,

"220,20,30",

Math.random()*1.2+.2

);

const x=
Math.random()*W;

const curve=
Math.pow(
(x-cx)/(W*.5),
2
)*180;

p.tx=x;

p.ty=
baseY+
curve+
Math.random()*60;

particles.push(p);

}


/* TORII / SHRINE STRUCTURE */

for(let i=0;i<1600;i++){

const side=
Math.random()>.5?1:-1;

const p=
new Particle(

cx,
baseY,

"255,230,230",

Math.random()*1.2+.2

);

p.tx=
cx+
side*
(120+
Math.random()*20);

p.ty=
baseY-
Math.random()*280;

particles.push(p);

}


/* TOP ROOF */

for(let i=0;i<1800;i++){

const p=
new Particle(

cx,
baseY,

"255,20,20",

Math.random()*1.3+.2

);

const progress=
Math.random();

p.tx=
cx+
(progress-.5)*520;

p.ty=
baseY-
300-
Math.sin(progress*Math.PI)*80+
Math.random()*25;

particles.push(p);

}

}



/* =====================================================
   RESET
===================================================== */

function resetScene(){

if(mode==="idle")
return;

mode="idle";

clearParticles();

status.innerText=
"SYSTEM READY";

}



/* =====================================================
   INFINITY UPDATE
===================================================== */

function updateInfinity(time){

const cx=W/2;
const cy=H/2;

const t=time*.001;


particles.forEach((p,i)=>{


if(
p.type==="infinityRing"
){

const pulse=
Math.sin(
t*2+
i*.02
)*12;

const angle=
p.angle+
t*.2;

p.tx=
cx+
Math.cos(angle)*
(p.radius+pulse);

p.ty=
cy+
Math.sin(angle)*
(p.radius+pulse);

}


if(
p.type==="space"
){

p.alpha=
.2+
Math.sin(
t*3+i
)*.5;

}


p.update();

p.draw();

});


/* CENTRAL VOID */

const gradient=
ctx.createRadialGradient(

cx,cy,20,
cx,cy,190

);

gradient.addColorStop(
0,
"rgba(0,0,0,.95)"
);

gradient.addColorStop(
.6,
"rgba(0,5,20,.5)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=gradient;

ctx.beginPath();

ctx.arc(
cx,
cy,
190,
0,
Math.PI*2
);

ctx.fill();

}



/* =====================================================
   RED UPDATE
===================================================== */

function updateRed(time){

const cx=W/2;
const cy=H/2;

const t=time*.001;


particles.forEach((p,i)=>{


if(
p.type==="redRing"
){

p.angle+=
.003+
p.ringIndex*.0005;

const pulse=
Math.sin(
t*3+i*.02
)*10;

p.tx=
cx+
Math.cos(p.angle)*
(p.radius+pulse);

p.ty=
cy+
Math.sin(p.angle)*
(p.radius+pulse);

}


if(
p.type==="redCore"
){

const dx=
p.tx-cx;

const dy=
p.ty-cy;

const dist=
Math.sqrt(dx*dx+dy*dy);

const pulse=
Math.sin(t*5)*8;

p.tx=
cx+
dx/dist*
(dist+pulse);

p.ty=
cy+
dy/dist*
(dist+pulse);

}


p.update();

p.draw();

});


/* RED GLOW */

const pulse=
1+
Math.sin(t*5)*.1;

const glow=
ctx.createRadialGradient(

cx,cy,5,

cx,cy,170*pulse

);

glow.addColorStop(
0,
"rgba(255,255,255,1)"
);

glow.addColorStop(
.12,
"rgba(255,220,220,1)"
);

glow.addColorStop(
.35,
"rgba(255,30,30,.9)"
);

glow.addColorStop(
1,
"rgba(255,0,0,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
cx,
cy,
170*pulse,
0,
Math.PI*2
);

ctx.fill();

}



/* =====================================================
   PARTICLE ANIMATION
===================================================== */

function animate(time){

requestAnimationFrame(animate);


ctx.fillStyle=
"rgba(0,0,0,.22)";

ctx.fillRect(
0,
0,
W,
H
);


if(mode==="infinity"){

updateInfinity(time);

}

else if(mode==="red"){

updateRed(time);

}

else{

drawIdle(time);

}

}



/* =====================================================
   IDLE BACKGROUND
===================================================== */

function drawIdle(time){

const t=time*.001;

for(let i=0;i<120;i++){

const x=
(
Math.sin(
t*.2+i*23
)*.5+.5
)*W;

const y=
(
Math.cos(
t*.15+i*17
)*.5+.5
)*H;

ctx.fillStyle=
"rgba(40,170,220,.25)";

ctx.fillRect(
x,
y,
1,
1
);

}

}



/* =====================================================
   MEDIAPIPE HAND DETECTION
===================================================== */

const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

);


const handLandmarker =
await HandLandmarker.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numHands:2

}

);


status.innerText=
"HAND TRACKING READY";


/* =====================================================
   DRAW HAND
===================================================== */

function drawHand(
landmarks
){

handCtx.clearRect(

0,
0,

handCanvas.width,
handCanvas.height

);


const connections=[

[0,1],[1,2],[2,3],[3,4],

[0,5],[5,6],[6,7],[7,8],

[5,9],[9,10],[10,11],[11,12],

[9,13],[13,14],[14,15],[15,16],

[13,17],[17,18],[18,19],[19,20],

[0,17]

];


/* LINES */

handCtx.strokeStyle=
"rgba(0,220,255,.9)";

handCtx.lineWidth=3;

connections.forEach(c=>{

const a=landmarks[c[0]];

const b=landmarks[c[1]];

handCtx.beginPath();

handCtx.moveTo(

a.x*handCanvas.width,

a.y*handCanvas.height

);

handCtx.lineTo(

b.x*handCanvas.width,

b.y*handCanvas.height

);

handCtx.stroke();

});


/* POINTS */

landmarks.forEach(p=>{

handCtx.beginPath();

handCtx.fillStyle="#fff";

handCtx.shadowBlur=10;

handCtx.shadowColor="#00d9ff";

handCtx.arc(

p.x*handCanvas.width,

p.y*handCanvas.height,

5,

0,

Math.PI*2

);

handCtx.fill();

});

handCtx.shadowBlur=0;

}



/* =====================================================
   FINGER EXTENDED DETECTION
===================================================== */

function fingerExtended(
landmarks,
tip,
pip,
mcp
){

const tipY=
landmarks[tip].y;

const pipY=
landmarks[pip].y;

const mcpY=
landmarks[mcp].y;

return(

tipY<pipY &&
pipY<mcpY

);

}



/* =====================================================
   GESTURE DETECTION
===================================================== */

function detectGesture(
landmarks
){

const index=
fingerExtended(
landmarks,
8,
6,
5
);

const middle=
fingerExtended(
landmarks,
12,
10,
9
);

const ring=
fingerExtended(
landmarks,
16,
14,
13
);

const pinky=
fingerExtended(
landmarks,
20,
18,
17
);


/*
GOJO:

Index + Middle

Other fingers closed

*/


if(
index &&
middle &&
!ring &&
!pinky
){

return"gojo";

}


/*
SUKUNA:

Open Palm

*/

if(
index &&
middle &&
ring &&
pinky
){

return"sukuna";

}


/*
FIST

*/

if(
!index &&
!middle &&
!ring &&
!pinky
){

return"reset";

}


return"none";

}



/* =====================================================
   DETECTION LOOP
===================================================== */

let lastVideoTime=-1;


async function predict(){

if(video.readyState>=2){

if(
video.currentTime!==lastVideoTime
){

lastVideoTime=
video.currentTime;


const result=
handLandmarker.detectForVideo(

video,

performance.now()

);


handCtx.clearRect(

0,
0,

handCanvas.width,
handCanvas.height

);


if(
result.landmarks &&
result.landmarks.length>0
){

result.landmarks.forEach(

landmarks=>{

drawHand(landmarks);

const gesture=
detectGesture(landmarks);


if(
gesture==="gojo"
){

status.innerText=
"GOJO POSE DETECTED";

activateInfinity();

}


else if(
gesture==="sukuna"
){

status.innerText=
"SUKUNA POSE DETECTED";

activateRed();

/*
DOMAIN STRUCTURE
*/

if(
mode==="red"
){

setTimeout(()=>{

if(mode==="red"){

createDomain();

}

},1200);

}

}


else if(
gesture==="reset"
){

resetScene();

}

}

);

}

}

}

requestAnimationFrame(predict);

}


predict();

animate();


</script>

</body>
</html>
